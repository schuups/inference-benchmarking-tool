# Apertus-70B single-node KV-cache grid — breithorn (Kubernetes). 4 cells.
#
# K8s counterpart of apertus70b-kvgrid-single-node-slurm.yaml: SAME two KV axes (offloading
# {disabled, native} × dtype {default, fp8} = 4 cells) and IDENTICAL dataset_config, so the
# shared real-text pool generated for the SLURM grid is reused here too (§11.4) — only the
# platform differs (the whole point of the SLURM-vs-K8s comparison). The benchmarker runs on
# clariden (global.yaml breithorn.benchmarker_cluster), load-gens against the breithorn ingress;
# the engine is deployed as a K8s manifest (single-node TP4 — no Ray).
#
# PRODUCTION CLUSTER (SPEC §6.2): breithorn is shared. Operate ONLY in the `ml` namespace; the
# tool creates/tears down namespaced engine objects per run and touches nothing shared.
#
# PREREQUISITE: Apertus-70B weights reachable on breithorn (ml-namespace PVC / capstor mount),
# AND the shared dataset pool staged into each run_dir/dataset/ (reused, not regenerated).
#
# Validate: .venv/bin/python -m tools.common.config examples/benchmark-configs/apertus70b-kvgrid-single-node-k8s.yaml

name: apertus70b-kvgrid-single-node-k8s
description: >
  Apertus-70B single-node (TP4, breithorn/K8s) KV-cache grid: KV-offloading {off, native} ×
  KV-dtype {default, fp8} = 4 cells. Identical workload/axes to the SLURM grid for a
  platform-to-platform (SLURM vs K8s) capacity + quality comparison at each KV config.

deployments:
  # ---- cell 1: offload OFF, dtype default (baseline) ----
  - target: breithorn
    backend: vllm
    backend_version: "0.23.0"
    image: jfrog.svc.cscs.ch/ml/inference/vllm:0.23.0-alps.net.v1-gh200
    model: swiss-ai/Apertus-70B-Instruct-2509
    backend_config:
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      max_model_len: 262144
      max_num_batched_tokens: 16384
      gpu_memory_utilization: 0.90
      enable_prefix_caching: true
      safetensors_load_strategy: prefetch
  # ---- cell 2: offload OFF, dtype fp8 ----
  - target: breithorn
    backend: vllm
    backend_version: "0.23.0"
    image: jfrog.svc.cscs.ch/ml/inference/vllm:0.23.0-alps.net.v1-gh200
    model: swiss-ai/Apertus-70B-Instruct-2509
    backend_config:
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      max_model_len: 262144
      max_num_batched_tokens: 16384
      gpu_memory_utilization: 0.90
      enable_prefix_caching: true
      safetensors_load_strategy: prefetch
      kv_cache_dtype: fp8
  # ---- cell 3: offload NATIVE (Grace DRAM), dtype default ----
  - target: breithorn
    backend: vllm
    backend_version: "0.23.0"
    image: jfrog.svc.cscs.ch/ml/inference/vllm:0.23.0-alps.net.v1-gh200
    model: swiss-ai/Apertus-70B-Instruct-2509
    backend_config:
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      max_model_len: 262144
      max_num_batched_tokens: 16384
      gpu_memory_utilization: 0.90
      enable_prefix_caching: true
      safetensors_load_strategy: prefetch
      kv_offloading_size: 400
      kv_offloading_backend: native
  # ---- cell 4: offload NATIVE + dtype fp8 ----
  - target: breithorn
    backend: vllm
    backend_version: "0.23.0"
    image: jfrog.svc.cscs.ch/ml/inference/vllm:0.23.0-alps.net.v1-gh200
    model: swiss-ai/Apertus-70B-Instruct-2509
    backend_config:
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      max_model_len: 262144
      max_num_batched_tokens: 16384
      gpu_memory_utilization: 0.90
      enable_prefix_caching: true
      safetensors_load_strategy: prefetch
      kv_offloading_size: 400
      kv_offloading_backend: native
      kv_cache_dtype: fp8

dataset_config:                        # IDENTICAL to the SLURM sibling → shared pool (§11.4)
  scenario_mix:
    - scenario: chat-short-turns
      weight: 0.8
      input_length:
        distribution: lognormal
        params: { mean: 500, sigma: 0.5, min: 50, max: 2000 }
    - scenario: agentic-coding
      weight: 0.2
      input_length:
        distribution: lognormal
        params: { mean: 10000, sigma: 0.5, min: 4000, max: 16000 }
  num_prompts: 180000
  seed: 1234
  output_length_mode: forced

rate_levels: [0.5, 1, 2, 4, 8, 16]

arrival_process:
  kind: poisson

routing_strategy: random

phases:
  warmup_s: 300
  measurement_s: 600
  drain_timeout_s: 600
  request_timeout_s: 300
  server_ready_timeout_s: 3000         # K8s adds first image-pull + ingress/cert on top of 70B load

slos:
  - { scenario: chat-short-turns, metric: ttft_ms,        percentile: p95, threshold: 800 }
  - { scenario: chat-short-turns, metric: tpot_ms,        percentile: p95, threshold: 80 }
  - { scenario: agentic-coding,   metric: session_e2e_ms, percentile: p90, threshold: 600000 }
  - { scenario: all,              metric: error_rate_pct,                  threshold: 1.0 }

quality_eval:
  gate:
    suite: gsm8k
    sample_size: 500
    floor: 0.20
    on_fail: abort
  compare:
    suites: [gsm8k]
    eval_concurrency: [1]
  skip_quality_gate: false
  skip_quality_compare: false

system_prechecks:
  skip_system_prechecks: false         # §8 K8s torch.distributed probe (decision 9)
  system_prechecks_on_warn: continue
  system_prechecks_on_fail: abort
  collective_tests_version: "2.18.2"
  shmem_required: false

server_time_limit: "04:00:00"
