# Global configuration — environmental constants shared by every experiment.
# See SPECIFICATIONS.md §3.3 for what belongs here (and what must stay in the
# per-experiment benchmark YAML instead). Loaded by tools/common/config.py.

clusters:
  clariden:
    type: slurm
    platform: mlp                  # FirecREST MCP "ML Platform"
    partition: normal
    gpus_per_node: 4
    gpu_label: GH200               # used in §8.3 reference scope strings
  bristen:
    type: slurm
    platform: mlp
    partition: normal
    gpus_per_node: 4
    gpu_label: A100                # sm_80 — see §6.1 portability note
  beverin:
    type: slurm
    platform: hpc                  # FirecREST MCP "HPC Platform"
    partition: mi300
    gpus_per_node: 4
    gpu_label: MI300A
  breithorn:
    type: k8s
    namespace: ml
    node_type: gh200               # nodeSelector node.kubernetes.io/instance-type
    gpus_per_node: 4
    gpu_label: gh200
    ingress_domain: breithorn.svc.cscs.ch   # engine Ingress host: ibt-engine-<slug>.<this>; nginx + cert-manager letsencrypt, reachable from the SLURM Benchmarker (§6.2)
    image_pull_secret: jfrog-pull            # dockerconfigjson secret in ns ml for jfrog.svc.cscs.ch (anonymous pull is 403)

slurm:
  account: csstaff                 # never use other accounts (§6.1)

# All project files on the cluster live under this single folder (§3.2/§3.3):
# run dirs, prompt pools, hf-cache, venv, image builds, caches.
scratch_base: /capstor/scratch/cscs/stefschu/ibt       # all IBT work under <scratch>/ibt
collective_tests_cache_dir: /capstor/scratch/cscs/stefschu/ibt/collective-tests-cache  # §8.2

registry:
  jfrog_base: https://jfrog.svc.cscs.ch/artifactory/ml/inference   # image publish base (§9.1); jf server-id cscs-jfrog
