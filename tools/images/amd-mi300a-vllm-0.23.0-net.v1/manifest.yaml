# ---- post-push sanity (filled by tests/, see tests/README) ----
sanity:
  status: partial            # intra-node + small inter-node green; LARGE inter-node BLOCKED
  ran_at: "2026-06-15T13:00+02:00"
  nodes: 2
  notes: >-
    AMD MI300A, self-contained model CONFIRMED: with the EDF cxi hook off (no aws-ofi
    hook), fi_info -p cxi enumerates 4 NICs and librccl-net.so loads exporting
    ncclNetPlugin v6-v11 (matches base RCCL 2.27.7). PASS: intra-node RCCL all_reduce
    (xGMI) and SMALL inter-node all_reduce (<=~4 MiB) complete. BLOCKED: inter-node
    all_reduce for >=64 MiB hangs or core-dumps. Root cause: aws-ofi-nccl v1.19.2 RDMA
    transport reports "No eligible providers" on MI300A/CXI even when forced
    (OFI_NCCL_PROTOCOL=RDMA + DISABLE_NATIVE_RDMA_CHECK + DISABLE_GDR_REQUIRED_CHECK),
    so it falls back to SENDRECV, which is unstable for large GPU messages over CXI.
    Tried, none fixed: GDR off, FI_CXI_RDZV_PROTO=default, NCCL_PROTO=Simple, force RDMA.
    The RDMA transport IS eligible on GH200 (NVIDIA, 129 GB/s) — upstream aws-ofi-nccl /
    MI300A-CXI enablement gap. MI300A Slingshot reference bandwidth (spec §8.3) remains
    TBD pending inter-node. See TODOs.md.
  todo_inter_node: true
