# tools/system_prechecks_reference.yaml
#
# Per-system reference values for the system performance pre-checks (SPECIFICATIONS.md §7).
# This file is the authoritative ground truth: §7.4 grades each pre-check measurement as
# pass / warn / fail by comparing it against the matching entry below.
#
# Entry shape: { cluster, scope, benchmark, size, expected, tolerance_pct, source }.
# tolerance_pct conventions:
#   negative → warn / fail if measured BELOW expected (bandwidth, throughput)
#   positive → warn / fail if measured ABOVE expected (latency)
#
# Status: all entries are placeholders until first characterisation runs on each system.
# Until populated, the foundation gate is unenforceable — measurements log as informational.

