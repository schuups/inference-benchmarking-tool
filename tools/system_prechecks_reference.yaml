# Single-stream O_DIRECT read of a real Apertus-8B safetensors blob (4 GiB). Measured 62.9 MB/s
# at E2a, but capstor was under general slowness then (operator-confirmed), so this is NOT a
# representative baseline — a conservative floor only, pending re-characterisation in a later
# phase (TODOs.md). A healthy capstor reads faster, so the -15% band won't false-fail; vLLM's
# parallel shard loads also aggregate higher than this single-stream floor.
- { cluster: clariden, scope: "capstor weights mount (Lustre, HDD)",  benchmark: Sequential read, size: 1 MiB blocks, expected: 0.063 GB/s, tolerance_pct: -15, source: "E2a 2026-06-14 (single sample during capstor degradation — re-characterise)" }
- { cluster: clariden, scope: "iopsstor weights mount (Lustre, flash)", benchmark: Sequential read, size: 1 MiB blocks, expected: TBD GB/s, tolerance_pct: -15, source: TBD }

