# tools/system_prechecks_reference.yaml
#
# Per-system reference values for the system performance pre-checks (SPECIFICATIONS.md §8).
# This file is the authoritative ground truth: §8.4 grades each pre-check measurement as
# pass / warn / fail by comparing it against the matching entry below.
#
# Entry shape: { cluster, scope, benchmark, size, expected, tolerance_pct, source }.
# tolerance_pct conventions:
#   negative → warn / fail if measured BELOW expected (bandwidth, throughput)
#   positive → warn / fail if measured ABOVE expected (latency)
#
# Status: all entries are placeholders until first characterisation runs on each system.
# Until populated, the foundation gate is unenforceable — measurements log as informational.

# ── clariden (NVIDIA GH200 — 4 GPUs / node) ─────────────────────────────────────
- { cluster: clariden, scope: "4× GH200, 1 node",  benchmark: NCCL all_reduce,           size: 128 MiB, expected: 317.7 GB/s busbw, tolerance_pct: -10, source: "E2a 2026-06-14 (first characterisation, mean of 2 runs: 316.73, 318.65)" }
- { cluster: clariden, scope: "4× GH200, 1 node",  benchmark: NCCL all_gather,           size: 128 MiB, expected: 283.5 GB/s busbw, tolerance_pct: -10, source: "E2a 2026-06-14 (first characterisation, mean of 2 runs: 283.55, 283.43)" }
- { cluster: clariden, scope: "4× GH200, 1 node",  benchmark: NCCL alltoall,             size: 128 MiB, expected: 306.2 GB/s busbw, tolerance_pct: -10, source: "E2a 2026-06-14 (first characterisation, mean of 2 runs: 307.75, 304.57)" }
# NVSHMEM stays TBD: perftest needs a dedicated multi-task `srun --mpi=pmix` step it cannot get
# inside the engine's single-task session — uncharacterised pending that step (TODOs.md, §8.1).
- { cluster: clariden, scope: "4× GH200, 1 node",  benchmark: NVSHMEM alltoall_latency,  size: 128 KiB, expected: TBD µs,         tolerance_pct: +20, source: TBD }
- { cluster: clariden, scope: "4× GH200, 1 node",  benchmark: NVSHMEM shmem_put_bw,      size: 128 MiB, expected: TBD GB/s,       tolerance_pct: -10, source: TBD }
