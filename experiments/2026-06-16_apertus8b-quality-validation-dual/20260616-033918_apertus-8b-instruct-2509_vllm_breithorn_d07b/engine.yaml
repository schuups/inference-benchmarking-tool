od\", benchmark: NVSHMEM shmem_put_bw,     size: 128 MiB, expected: TBD GB/s,       tolerance_pct: -10, source: TBD }\n- { cluster: breithorn, scope: \"Ceph PVC weights mount\", benchmark: Sequential read,   size: 1 MiB blocks, expected: TBD GB/s, tolerance_pct: -15, source: TBD }\n- { cluster: breithorn, scope: \"Ceph PVC weights mount\", benchmark: Parallel read,     size: aggregate,    expected: TBD GB/s, tolerance_pct: -15, source: TBD }\n"
---
# Per-run results scratch (/results): §8 pre-check JSON, hw-sampler NDJSON, and the per-run
# SQLite DB. Manifest-scoped, so `kubectl apply` creates it and `kubectl delete -f` reclaims
# it — the Coordinator downloads /results BEFORE teardown (§7.3). Distinct from the retained,
# pre-populated model-cache PVC (§7.6).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ibt-results-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
  namespace: ml
  labels:
    app.kubernetes.io/managed-by: inference-benchmarking
    inference-benchmarking/run-id: "20260616-033918_apertus-8b-instruct-2509_vllm_breithorn_d07b"
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ceph-corbo-cephfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
  namespace: ml
  labels:
    app.kubernetes.io/managed-by: inference-benchmarking
    inference-benchmarking/run-id: "20260616-033918_apertus-8b-instruct-2509_vllm_breithorn_d07b"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
  template:
    metadata:
      labels:
        app: ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
        app.kubernetes.io/managed-by: inference-benchmarking
    spec:

      imagePullSecrets:
      - name: jfrog-pull   # JFrog dockerconfigjson (anonymous pull is 403)

      nodeSelector:
        node.kubernetes.io/instance-type: gh200
      tolerations:
      - { key: hpc, operator: Equal, value: "true", effect: NoSchedule }
      - { key: hpc, operator: Equal, value: "true", effect: NoExecute }
      containers:
      - name: engine
        image: jfrog.svc.cscs.ch/ml/inference/vllm:0.23.0-alps.net.v1-gh200
        # §8.2: pre-checks + sampler share the engine container; gate failure stops the pod
        command: ["bash", "-c"]
        args:
          - >
            bash /tools/benchmarker/prechecks/run_system_prechecks.sh &&
            { python3 /tools/benchmarker/hw_sampler.py --out /results/hw-$(hostname).ndjson
            --interval 1.0 & exec vllm serve swiss-ai/Apertus-8B-Instruct-2509 --host 0.0.0.0 --port 8000 --served-model-name swiss-ai/Apertus-8B-Instruct-2509 --tensor-parallel-size 1 --max-model-len 16384 --gpu-memory-utilization 0.9 --enable-prefix-caching; }
        env:
        # K8s NCCL override (decision 9): the self-contained Alps image bakes SLURM/Slingshot
        # networking (NCCL_NET="AWS Libfabric", FI_PROVIDER=cxi, NCCL_SOCKET_IFNAME=hsn) — none of
        # which exist in a breithorn pod, so NCCL can't bootstrap ("no socket interface found"),
        # failing BOTH the §8 probe and vLLM's TP. Force the socket transport over the pod's eth0;
        # intra-node GPU↔GPU still rides NVLink P2P (NCCL_P2P_LEVEL=NVL stays). Multi-node K8s would
        # need a real RDMA net here instead (future — decision 9 / Ray path).
        - { name: NCCL_NET, value: "Socket" }
        - { name: NCCL_SOCKET_IFNAME, value: "eth0" }
        - { name: NCCL_IB_DISABLE, value: "1" }
        - { name: PRECHECK_CLUSTER, value: "breithorn" }
        - { name: PRECHECK_SCOPE, value: "1× gh200, 1 pod" }
        - { name: PRECHECK_STORAGE_SCOPE, value: "Ceph PVC weights mount" }
        - { name: PRECHECK_OUT, value: "/results/prechecks" }
        - { name: PRECHECK_ON_WARN, value: "abort" }
        - { name: PRECHECK_ON_FAIL, value: "abort" }
        - { name: SKIP_SYSTEM_PRECHECKS, value: "1" }
        - { name: NCCL_TESTS_VERSION, value: "2.18.2" }
        - { name: NCCL_TESTS_CACHE, value: "/results/collective-tests-cache" }
        - { name: NVSHMEM_REQUIRED, value: "0" }
        # §8 launcher (IMPLEMENTATION_PLAN decision 9): K8s has no srun/PMIx, so the
        # foundation check runs the torch.distributed collective probe — one rank per GPU
        # via torchrun (single-node / this 1-pod case; Ray placement for multi-node, future)
        # — instead of MPI nccl-tests. Same all_reduce/all_gather/alltoall busbw, same
        # grade.py rows. PRECHECK_GPUS = ranks (one per GPU in the pod).
        - { name: PRECHECK_LAUNCHER, value: "torch" }
        - { name: PRECHECK_GPUS, value: "1" }
        - { name: MSG_END, value: "128M" }
        # Resolve weights from the pre-populated HF cache on the model-cache PVC
        # (mounted read-only below) — no HF egress, no HF_TOKEN, no writes.
        - { name: HF_HOME, value: "/model-cache" }
        - { name: HF_HUB_OFFLINE, value: "1" }
        ports:
        - { containerPort: 8000, name: http, protocol: TCP }
        resources:
          requests:
            nvidia.com/gpu: 1
            ephemeral-storage: 60Gi
          limits:
            nvidia.com/gpu: 1
        startupProbe:
          httpGet: { path: /health, port: 8000 }
          periodSeconds: 10
          failureThreshold: 120
        volumeMounts:
        # read-only: the model-cache PVC is shared and may be owned/used by others —
        # a run must never mutate it (§7.6). Weights are pre-populated out-of-band.
        - { name: model-cache, mountPath: /model-cache, readOnly: true }
        - { name: results, mountPath: /results }
        # §8 pre-check + sampler scripts (read-only); SLURM mounts these from capstor (decision 9).
        - { name: tools, mountPath: /tools, readOnly: true }
      volumes:
      - name: tools
        configMap:
          name: ibt-tools-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
          items:
          - { key: "_stack-fingerprint.sh", path: "benchmarker/prechecks/_stack-fingerprint.sh" }
          - { key: "build-nccl-tests.sh", path: "benchmarker/prechecks/build-nccl-tests.sh" }
          - { key: "run-collectives-torch.sh", path: "benchmarker/prechecks/run-collectives-torch.sh" }
          - { key: "run-collectives.sh", path: "benchmarker/prechecks/run-collectives.sh" }
          - { key: "run-nvshmem.sh", path: "benchmarker/prechecks/run-nvshmem.sh" }
          - { key: "run-storage.sh", path: "benchmarker/prechecks/run-storage.sh" }
          - { key: "run_system_prechecks.sh", path: "benchmarker/prechecks/run_system_prechecks.sh" }
          - { key: "collective_probe.py", path: "benchmarker/prechecks/collective_probe.py" }
          - { key: "grade.py", path: "benchmarker/prechecks/grade.py" }
          - { key: "hw_sampler.py", path: "benchmarker/hw_sampler.py" }
          - { key: "system_prechecks_reference.yaml", path: "system_prechecks_reference.yaml" }
      - name: model-cache
        persistentVolumeClaim:
          # Org-inclusive slug to match the cluster's PVC naming (model_cache_slug,
          # NOT model_slug which drops the org). §7.6: kept across runs, never written.
          claimName: model-cache-swiss-ai-apertus-8b-instruct-2509
      - name: results
        persistentVolumeClaim:
          claimName: ibt-results-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
---
apiVersion: v1
kind: Service
metadata:
  name: ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
  namespace: ml
  labels:
    app.kubernetes.io/managed-by: inference-benchmarking
    inference-benchmarking/run-id: "20260616-033918_apertus-8b-instruct-2509_vllm_breithorn_d07b"
spec:
  selector:
    app: ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
  ports:
  - { port: 8000, targetPort: 8000, name: http }

---
# SLURM-Benchmarker-reachable endpoint (§6.2). nginx + cert-manager letsencrypt;
# the TLS cert is issued ~1-2 min after apply (HTTP-01), so the load generator's
# readiness wait must tolerate connection/cert errors during that window.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
  namespace: ml
  labels:
    app.kubernetes.io/managed-by: inference-benchmarking
    inference-benchmarking/run-id: "20260616-033918_apertus-8b-instruct-2509_vllm_breithorn_d07b"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Long LLM streaming requests + large prompt bodies.
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c.breithorn.svc.cscs.ch
    secretName: ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c-cert
  rules:
  - host: ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c.breithorn.svc.cscs.ch
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ibt-engine-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
            port:
              number: 8000

