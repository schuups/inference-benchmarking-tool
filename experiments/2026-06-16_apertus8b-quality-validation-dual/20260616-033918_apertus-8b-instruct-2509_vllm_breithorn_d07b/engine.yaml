# Engine Deployment + Service + Ingress (breithorn) — rendered by the Planner (§5).
# Labels per §7.1 so the Cleaner and per-run teardown can discover everything.
# The Ingress (host ibt-engine-<slug>.<ingress_domain>, nginx + cert-manager
# letsencrypt) is what the SLURM Benchmarker's load generator targets (§6.2); it
# renders only when the cluster declares an ingress_domain. Cert issuance +
# ingress wiring take ~2-3 min after apply — the orchestrator readiness wait
# tolerates that window (_await_ready).
# run_id: 20260616-033918_apertus-8b-instruct-2509_vllm_breithorn_d07b
#
# §8 pre-check + hw-sampler scripts reach the pod at /tools via this inlined ConfigMap — the
# K8s analog of SLURM's staged-tools mount (decision 9). Rendered from the live working tree,
# so uncommitted code is delivered with one `kubectl apply`; keys are basenames, the volume's
# `items` (below) map each to its path under /tools. ~128 KiB, well under the 1 MiB CM limit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ibt-tools-20260616-033918-apertus-8b-instruct-2509-vll-1c5d0c
  namespace: ml
  labels:
    app.kubernetes.io/managed-by: inference-benchmarking
    inference-benchmarking/run-id: "20260616-033918_apertus-8b-instruct-2509_vllm_breithorn_d07b"
data:
  _stack-fingerprint.sh: "# Shared helper \u2014 sourced by build-nccl-tests.sh and run-collectives.sh.\n# Computes a deterministic fingerprint of the build-relevant stack inside the\n# engine container, so any change to CUDA / NCCL / OpenMPI / libfabric /\n# nccl-tests lands in a separate cache directory and never reuses an\n# ABI-incompatible build.\n#\n# Both scripts must compute the same value, which they will as long as they\n# run in the same container session (the whole point of running pre-checks\n# inside the engine container).\n\nstack_fingerprint() {\n    {\n        echo \"nccl_tests=${NCCL_TESTS_VERSION:-unset}\"\n        echo \"mpi_build=${NCCL_TESTS_MPI:-0}\"\n\n        if command -v nvcc \u003e/dev/null 2\u003e\u00261; then\n            nvcc --version 2\u003e/dev/null | grep -iE \u0027release\u0027 | head -1\n        else\n            echo \"cuda=missing\"\n        fi\n\n        if command -v mpicxx \u003e/dev/null 2\u003e\u00261; then\n            (mpicxx --showme:version 2\u003e\u00261 || mpicxx --version 2\u003e\u00261) | head -1\n        elif command -v mpic++ \u003e/dev/null 2\u003e\u00261; then\n            mpic++ --version 2\u003e\u00261 | head -1\n        else\n            echo \"mpi=missing\"\n        fi\n\n        # NCCL header version \u2014 pick the first nccl.h that exists.\n        local h\n        for h in /usr/include/nccl.h /usr/local/include/nccl.h /usr/local/cuda/include/nccl.h; do\n            if [ -r \"$h\" ]; then\n                grep -E \u0027#define NCCL_(MAJOR|MINOR|PATCH)\u0027 \"$h\"\n                break\n            fi\n        done\n\n        # libfabric \u2014 loaded at runtime by the AWS OFI hook, but versioning it\n        # here so a libfabric bump in the engine image triggers a fresh cache.\n        if command -v fi_info \u003e/dev/null 2\u003e\u00261; then\n            fi_info --version 2\u003e\u00261 | head -1\n        elif command -v pkg-config \u003e/dev/null 2\u003e\u00261 \u0026\u0026 pkg-config --exists libfabric 2\u003e/dev/null; then\n            echo \"libfabric=$(pkg-config --modversion libfabric)\"\n        else\n            echo \"libfabric=unknown\"\n        fi\n    } | sha256sum | cut -c1-16\n}\n\n# Echoes the cache directory for the current stack.\ncache_dir_for_stack() {\n    : \"${NCCL_TESTS_VERSION:?must be set}\"\n    : \"${NCCL_TESTS_CACHE:?must be set}\"\n    echo \"${NCCL_TESTS_CACHE}/v${NCCL_TESTS_VERSION}-$(stack_fingerprint)\"\n}\n\n# nccl-tests `*_perf` binaries are PREBUILT (MPI-linked, by root) in the engine image\n# on Alps (e.g. /usr/local/bin/all_reduce_perf). Prefer them so the pre-check never\n# builds at run time \u2014 the non-root container can\u0027t install an MPI toolchain, and the\n# image\u0027s binaries already match its CUDA/NCCL/MPI/libfabric stack. Same discover-don\u0027t-\n# build model as run-nvshmem.sh. Override with NCCL_TESTS_BIN_DIR.\n_NCCL_TESTS_PREBUILT_DIRS=\"/usr/local/bin /usr/local/nccl-tests/build /opt/nccl-tests/build\"\n\n# True (exit 0) if a prebuilt nccl-tests set is available in the image.\nnccl_tests_prebuilt() {\n    if [ -n \"${NCCL_TESTS_BIN_DIR:-}\" ] \u0026\u0026 [ -x \"${NCCL_TESTS_BIN_DIR}/all_reduce_perf\" ]; then\n        return 0\n    fi\n    local d\n    for d in ${_NCCL_TESTS_PREBUILT_DIRS}; do\n        [ -x \"${d}/all_reduce_perf\" ] \u0026\u0026 return 0\n    done\n    return 1\n}\n\n# Echoes the directory holding the nccl-tests `*_perf` binaries: a prebuilt set if\n# present, else the build cache dir (populated on demand by build-nccl-tests.sh).\nnccl_tests_bindir() {\n    if [ -n \"${NCCL_TESTS_BIN_DIR:-}\" ] \u0026\u0026 [ -x \"${NCCL_TESTS_BIN_DIR}/all_reduce_perf\" ]; then\n        echo \"${NCCL_TESTS_BIN_DIR}\"; return 0\n    fi\n    local d\n    for d in ${_NCCL_TESTS_PREBUILT_DIRS}; do\n        [ -x \"${d}/all_reduce_perf\" ] \u0026\u0026 { echo \"${d}\"; return 0; }\n    done\n    echo \"$(cache_dir_for_stack)/build\"\n}\n"
  build-nccl-tests.sh: "#!/bin/bash\n#\n# Build nccl-tests inside the engine container, caching binaries on persistent\n# storage. Two things make this distinct from a \"vanilla\" build:\n#\n# 1. Stack-aware cache key. The cache dir is keyed by both the nccl-tests\n#    version AND a fingerprint of the CUDA / NCCL / OpenMPI / libfabric\n#    versions detected in the engine container. Any change to the engine\n#    image lands in a new cache dir; older caches survive (revertable).\n#\n# 2. Install-on-missing. If make / g++ / mpicxx / curl / tar are missing,\n#    we install them via apt-get / dnf / yum inside the engine container\n#    rather than aborting. Only the rank holding the build lock performs\n#    the install, so apt is not hit by N concurrent ranks.\n#\n# Safe to invoke from every rank under srun --mpi=pmix: a SLURM-rank check\n# gates the install + build to rank 0 (globally); the remaining ranks wait\n# on the sentinel.\n#\n# Required env:\n#   NCCL_TESTS_VERSION   git tag of github.com/NVIDIA/nccl-tests (e.g. \"2.17.1\")\n#   NCCL_TESTS_CACHE     persistent dir for sources + built binaries\n#                        (e.g. /capstor/scratch/cscs/$USER/nccl-tests-cache)\n\nset -eo pipefail\n\n: \"${NCCL_TESTS_VERSION:?must be set}\"\n: \"${NCCL_TESTS_CACHE:?must be set}\"\n\nTHIS_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" \u0026\u0026 pwd)\"\n# shellcheck source=_stack-fingerprint.sh\nsource \"${THIS_DIR}/_stack-fingerprint.sh\"\n\nrank0() { [ \"${SLURM_PROCID:-0}\" = \"0\" ]; }\n\n# ---------------------------------------------------------------- prebuilt short-circuit\n# The Alps engine image ships prebuilt, MPI-linked nccl-tests (e.g. /usr/local/bin/*_perf).\n# Prefer them: the non-root container can\u0027t install an MPI build toolchain, and the image\u0027s\n# binaries already match its CUDA/NCCL/MPI/libfabric stack. Nothing to build.\nif nccl_tests_prebuilt; then\n    rank0 \u0026\u0026 echo \"[build] prebuilt nccl-tests present ($(nccl_tests_bindir)) \u2014 skipping build\"\n    exit 0\nfi\n\nCACHE_DIR=\"$(cache_dir_for_stack)\"\nSENTINEL=\"${CACHE_DIR}/build/.built\"\n\n# ---------------------------------------------------------------- cache hit\nif [ -f \"${SENTINEL}\" ]; then\n    rank0 \u0026\u0026 echo \"[build] cache hit: ${CACHE_DIR}/build/\"\n    exit 0\nfi\n\n# ---------------------------------------------------------------- non-rank-0 wait\n# Only the globally-first rank does the install + build. The rest poll the\n# sentinel (which is on the shared cache filesystem, visible across nodes).\nif ! rank0; then\n    timeout=1200\n    while [ ! -f \"${SENTINEL}\" ] \u0026\u0026 [ \"${timeout}\" -gt 0 ]; do\n        sleep 2\n        timeout=$((timeout - 2))\n    done\n    if [ ! -f \"${SENTINEL}\" ]; then\n        echo \"[build] rank ${SLURM_PROCID}: timed out waiting for rank-0 build at ${CACHE_DIR}\" \u003e\u00262\n        exit 1\n    fi\n    exit 0\nfi\n\n# ---------------------------------------------------------------- rank-0: install\necho \"[build] cache miss; building nccl-tests v${NCCL_TESTS_VERSION} (stack fp $(stack_fingerprint))\"\necho \"[build]   target: ${CACHE_DIR}/build/\"\n\nneed_install=0\nfor tool in make g++ curl tar; do\n    command -v \"$tool\" \u003e/dev/null 2\u003e\u00261 || need_install=1\ndone\ncommand -v mpicxx \u003e/dev/null 2\u003e\u00261 || command -v mpic++ \u003e/dev/null 2\u003e\u00261 || need_install=1\n\nif [ \"${need_install}\" = \"1\" ]; then\n    echo \"[build] one or more build tools missing \u2014 installing in the engine container\"\n    SUDO=\"\"\n    if [ \"$(id -u)\" != \"0\" ] \u0026\u0026 command -v sudo \u003e/dev/null 2\u003e\u00261; then\n        SUDO=\"sudo\"\n    fi\n\n    if command -v apt-get \u003e/dev/null 2\u003e\u00261; then\n        ${SUDO} apt-get update -qq || true\n        ${SUDO} DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \\\n            ca-certificates curl tar make g++ libopenmpi-dev openmpi-bin \\\n            || echo \"[build] WARN: apt-get install returned non-zero; continuing with whatever is available\"\n    elif command -v dnf \u003e/dev/null 2\u003e\u00261; then\n        ${SUDO} dnf install -y -q ca-certificates curl tar make gcc-c++ openmpi openmpi-devel \\\n            || echo \"[build] WARN: dnf install returned non-zero; continuing\"\n    elif command -v yum \u003e/dev/null 2\u003e\u00261; then\n        ${SUDO} yum install -y -q ca-certificates curl tar make gcc-c++ openmpi openmpi-devel \\\n            || echo \"[build] WARN: yum install returned non-zero; continuing\"\n    else\n        echo \"[build] WARN: no apt/dnf/yum found in engine image; relying on whatever is already installed\"\n    fi\nfi\n\n# Re-export common OpenMPI paths so mpicxx resolves on RHEL-family images that\n# only put it under /usr/lib64/openmpi/bin.\nfor d in /usr/lib64/openmpi/bin /usr/lib/openmpi/bin; do\n    [ -d \"$d\" ] \u0026\u0026 PATH=\"$d:${PATH}\"\ndone\nexport PATH\n\n# ---------------------------------------------------------------- rank-0: build\nmkdir -p \"${NCCL_TESTS_CACHE}\"\nSRC_DIR=\"$(mktemp -d \"${NCCL_TESTS_CACHE}/.tmp.v${NCCL_TESTS_VERSION}.XXXXXX\")\"\ntrap \u0027rm -rf \"${SRC_DIR}\"\u0027 EXIT\n\ncurl -fsSL \"https://github.com/NVIDIA/nccl-tests/archive/refs/tags/v${NCCL_TESTS_VERSION}.tar.gz\" \\\n    | tar xz -C \"${SRC_DIR}\" --strip-components=1\n\n# Build flavor (cache-keyed via the stack fingerprint):\n#   NCCL_TESTS_MPI=0 (default) \u2014 single-process binaries (-g N drives all GPUs\n#     of one node); no MPI runtime needed. Right for single-node scopes and\n#     robust on stock vendor images whose apt-OpenMPI PMIx clashes with\n#     Slurm\u0027s pmix plugin.\n#   NCCL_TESTS_MPI=1 \u2014 one rank per GPU across nodes; requires an MPI built\n#     against the cluster\u0027s PMIx (the Alps engine image provides this).\nif [ \"${NCCL_TESTS_MPI:-0}\" = \"1\" ]; then\n    # nccl-tests needs MPI_HOME when mpi.h sits outside the default include\n    # path (e.g. Ubuntu multiarch /usr/lib/\u003carch\u003e-linux-gnu/openmpi).\n    if [ -z \"${MPI_HOME:-}\" ]; then\n        for d in \"/usr/lib/$(uname -m)-linux-gnu/openmpi\" /usr/lib/x86_64-linux-gnu/openmpi \\\n                 /usr/lib64/openmpi /usr/local/openmpi /usr/local/mpi /usr; do\n            if [ -f \"${d}/include/mpi.h\" ]; then MPI_HOME=\"${d}\"; break; fi\n        done\n    fi\n    if [ -z \"${MPI_HOME:-}\" ] \u0026\u0026 command -v mpicc \u003e/dev/null 2\u003e\u00261; then\n        inc=\"$(mpicc --showme:incdirs 2\u003e/dev/null | awk \u0027{print $1}\u0027)\"\n        if [ -n \"${inc}\" ] \u0026\u0026 [ -f \"${inc}/mpi.h\" ]; then MPI_HOME=\"$(dirname \"${inc}\")\"; fi\n    fi\n    if [ -z \"${MPI_HOME:-}\" ]; then\n        echo \"[build] mpi.h not found anywhere \u2014 cannot build with MPI=1\" \u003e\u00262\n        exit 1\n    fi\n    echo \"[build] MPI_HOME=${MPI_HOME}\"\n    (cd \"${SRC_DIR}\" \u0026\u0026 MPI=1 MPI_HOME=\"${MPI_HOME}\" make -j\"$(nproc)\")\nelse\n    echo \"[build] MPI-less build (single-process, -g N)\"\n    (cd \"${SRC_DIR}\" \u0026\u0026 make -j\"$(nproc)\")\nfi\n\n# Atomic publish: move into place, then write the sentinel last.\nmkdir -p \"${CACHE_DIR}\"\nrm -rf \"${CACHE_DIR}/build.partial\"\nmv \"${SRC_DIR}/build\" \"${CACHE_DIR}/build.partial\"\nrm -rf \"${CACHE_DIR}/build\"\nmv \"${CACHE_DIR}/build.partial\" \"${CACHE_DIR}/build\"\ntouch \"${SENTINEL}\"\n\necho \"[build] published at ${CACHE_DIR}/build/\"\n"
  run-collectives-torch.sh: "#!/bin/bash\n#\n# Launch the torch.distributed collective probe (collective_probe.py) one rank per GPU \u2014 the\n# K8s \u00a78 foundation check (SPECIFICATIONS.md \u00a78.2, IMPLEMENTATION_PLAN.md decision 9). It\n# replaces the MPI nccl-tests SLURM uses, because K8s has no srun/PMIx; the probe measures the\n# same all_reduce / all_gather / alltoall busbw on vLLM\u0027s own torch+NCCL stack and writes the\n# same collective_\u003cc\u003e.out rows grade.py reads.\n#\n# SINGLE-NODE / 1 pod (this script): torchrun --standalone spawns the ranks locally.\n# MULTI-NODE (future, decision 9): a Ray placement launcher sets RANK/WORLD_SIZE/MASTER_ADDR\n# across pods and runs collective_probe.py directly \u2014 same probe, different rendezvous (TODOs).\n#\n# Required env: PRECHECK_OUT (writable), PRECHECK_GPUS (ranks = GPUs in the pod).\n# Optional: COLLECTIVES (default \"all_reduce all_gather alltoall\"), MSG_BYTES (default 128 MiB).\n\nset -eo pipefail\n\n: \"${PRECHECK_OUT:?must be set}\"\n: \"${PRECHECK_GPUS:?must be set}\"\n\nTHIS_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" \u0026\u0026 pwd)\"\n\ntorchrun --standalone --nnodes=1 --nproc-per-node=\"${PRECHECK_GPUS}\" \\\n    \"${THIS_DIR}/collective_probe.py\" \\\n    --collectives \"${COLLECTIVES:-all_reduce all_gather alltoall}\" \\\n    --bytes \"${MSG_BYTES:-134217728}\" \\\n    --out-dir \"${PRECHECK_OUT}\"\n"
  run-collectives.sh: "#!/bin/bash\n#\n# Run a configurable set of NCCL collectives at the current rank topology.\n# Executed by every rank under `srun --mpi=pmix`; nccl-tests binaries use\n# PMIx to discover rank/size and only rank 0 prints results.\n#\n# Default collective set covers what LLM serving actually exercises:\n#   - all_reduce   : tensor-parallel forward path (every TP step)\n#   - all_gather   : TP with sequence parallelism; weight-gather paths\n#   - alltoall     : MoE token-to-expert dispatch and reverse path\n#\n# nccl-tests also ships reduce_scatter_perf, broadcast_perf, sendrecv_perf,\n# scatter_perf, gather_perf, reduce_perf, hypercube_perf \u2014 append to\n# $COLLECTIVES to include them (e.g. \"sendrecv\" for pipeline-parallel\n# serving).\n#\n# Required env:\n#   NCCL_TESTS_VERSION   matches what build-nccl-tests.sh produced\n#   NCCL_TESTS_CACHE     same as above\n#   MSG_END              upper bound of the message-size sweep (e.g. \"128M\",\n#                        \"8G\"). Lower bound is 8 B; factor x2.\n# Optional:\n#   COLLECTIVES          space-separated list (default: all_reduce all_gather alltoall)\n\nset -eo pipefail\n\n: \"${NCCL_TESTS_VERSION:?must be set}\"\n: \"${NCCL_TESTS_CACHE:?must be set}\"\n: \"${MSG_END:?must be set (e.g. 128M or 8G)}\"\n: \"${COLLECTIVES:=all_reduce all_gather alltoall}\"\n\nTHIS_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" \u0026\u0026 pwd)\"\n# shellcheck source=_stack-fingerprint.sh\nsource \"${THIS_DIR}/_stack-fingerprint.sh\"\n# Prebuilt binaries in the image if present (Alps net image), else the build cache.\nBUILD_DIR=\"$(nccl_tests_bindir)\"\n\nrank0() { [ \"${SLURM_PROCID:-0}\" = \"0\" ]; }\n\nfail=0\nfor c in ${COLLECTIVES}; do\n    bin=\"${BUILD_DIR}/${c}_perf\"\n    if [ ! -x \"${bin}\" ]; then\n        rank0 \u0026\u0026 echo \"[nccl] missing ${bin} \u2014 was build-nccl-tests.sh called first?\" \u003e\u00262\n        fail=1\n        continue\n    fi\n    rank0 \u0026\u0026 echo \"===== ${c} =====\"\n    # PRECHECK_GPUS: GPUs driven by this process \u2014 the deployment\u0027s GPU count\n    # for single-node MPI-less builds; 1 per rank for MPI builds (\u00a77.2).\n    \"${bin}\" -b 8 -e \"${MSG_END}\" -f 2 -g \"${PRECHECK_GPUS:-1}\" \\\n        || { rank0 \u0026\u0026 echo \"[nccl] ${c} failed (non-zero exit)\" \u003e\u00262; fail=1; }\ndone\n\nexit \"${fail}\"\n"
  run-nvshmem.sh: "#!/bin/bash\n#\n# Run NVSHMEM perftest across the PEs of the CURRENT srun step (one PE per task).\n#\n# NVSHMEM perftest is multi-PROCESS: one PE per process, wired up by the launcher\u0027s\n# PMIx. Per CSCS guidance (docs.cscs.ch/software/communication/nvshmem) the supported\n# launch on Alps is a DEDICATED SLURM step \u2014 SLURM (not a nested mpirun) supplies the\n# PEs and bootstraps them over PMIx:\n#     srun --ntasks-per-node=N --mpi=pmix --environment=\u003cedf\u003e bash run-nvshmem.sh\n# Each task execs the binary for its PE; SLURM runs N copies into one N-PE job.\n#\n# The \u00a78 pre-checks otherwise run INSIDE the engine\u0027s single-task srun session, which\n# NVSHMEM cannot share (1 task \u21d2 1 PE \u21d2 degenerate: a collective reports busbw\u22610, a\n# pt-to-pt test aborts \"requires exactly two processes\"). When this script sees a\n# single-task step it SKIPS with a clear message instead of emitting a bogus single-PE\n# number; a dedicated multi-task NVSHMEM step is the proper home (pending design\n# decision \u2014 the engine session disables the CXI hook the inter-node libfabric/cxi\n# transport needs; see TODOs.md and engine.sbatch.j2).\n#\n# Required env (set below per CSCS docs):\n#   PMIX_MCA_psec=native            native (no-munge) PMIx peer auth on Alps\n#   NVSHMEM_DISABLE_CUDA_VMM=1       libfabric transport has no VMM support yet\n#   NVSHMEM_REMOTE_TRANSPORT=libfabric / NVSHMEM_LIBFABRIC_PROVIDER=cxi  (inter-node)\n# Optional:\n#   NVSHMEM_BIN_DIR     explicit path to a perftest dir; takes priority\n#   NVSHMEM_TESTS       relative paths from the perftest dir, space-separated\n#                       (default: alltoall_latency + put bandwidth)\n#   NVSHMEM_REQUIRED    1 \u2192 fail if perftest binaries are absent / no PEs to run them\n\nset -eo pipefail\n\nrank0() { [ \"${SLURM_PROCID:-0}\" = \"0\" ]; }\n\n# ---------------------------------------------------------------- locate perftest\nCANDIDATES=(\n    \"${NVSHMEM_BIN_DIR:-}\"\n    \"/opt/nvshmem/bin/perftest\"\n    \"/usr/local/nvshmem/bin/perftest\"\n    \"/usr/lib/x86_64-linux-gnu/nvshmem/bin/perftest\"\n    \"/usr/local/cuda/nvshmem/bin/perftest\"\n)\n\nBINDIR=\"\"\nfor d in \"${CANDIDATES[@]}\"; do\n    [ -n \"$d\" ] \u0026\u0026 [ -d \"$d\" ] || continue\n    BINDIR=\"$d\"\n    break\ndone\n\nif [ -z \"${BINDIR}\" ]; then\n    rank0 \u0026\u0026 {\n        echo \"[nvshmem] NVSHMEM perftest not found in this engine image\"\n        echo \"[nvshmem]   tried: ${CANDIDATES[*]}\"\n        echo \"[nvshmem]   set NVSHMEM_BIN_DIR to override, or add NVSHMEM to the engine image\"\n    }\n    if [ \"${NVSHMEM_REQUIRED:-0}\" = \"1\" ]; then\n        rank0 \u0026\u0026 echo \"[nvshmem] NVSHMEM_REQUIRED=1 \u2014 failing\" \u003e\u00262\n        exit 1\n    fi\n    exit 0\nfi\n\n# ---------------------------------------------------------------- env (CSCS)\n# Native (no-munge) PMIx peer auth for the in-step PEs; libfabric transport has no\n# VMM support yet. The inter-node transport is the image\u0027s OWN bundled libfabric/cxi\n# (the self-contained Alps net image): the host CXI / aws_ofi_nccl hooks stay\n# DISABLED \u2014 we do not rely on host injection. Intra-node NVSHMEM uses NVLink P2P\n# and ignores the libfabric vars.\nexport PMIX_MCA_psec=\"${PMIX_MCA_psec:-native}\"\nexport NVSHMEM_DISABLE_CUDA_VMM=\"${NVSHMEM_DISABLE_CUDA_VMM:-1}\"\nexport NVSHMEM_REMOTE_TRANSPORT=\"${NVSHMEM_REMOTE_TRANSPORT:-libfabric}\"\nexport NVSHMEM_LIBFABRIC_PROVIDER=\"${NVSHMEM_LIBFABRIC_PROVIDER:-cxi}\"\n\n# ---------------------------------------------------------------- PE topology\n# One PE per task in THIS srun step. NVSHMEM bootstraps over SLURM\u0027s PMIx \u2014 never a\n# nested mpirun (it would re-inherit SLURM\u0027s 1-task PMIx server and collapse to\n# npes=1, with munge psec auth errors). The \u00a78 engine session is single-task, so\n# NVSHMEM cannot run there; a dedicated `srun --ntasks-per-node=N --mpi=pmix` step\n# is required. Skip cleanly when the step has fewer than 2 PEs.\npes=\"${SLURM_STEP_NUM_TASKS:-${SLURM_NTASKS:-1}}\"\nif [ \"${pes}\" -lt 2 ]; then\n    rank0 \u0026\u0026 {\n        echo \"[nvshmem] single-task step (${pes} PE) \u2014 NVSHMEM perftest needs a dedicated\"\n        echo \"[nvshmem]   multi-task \u0027srun --ntasks-per-node=N --mpi=pmix\u0027 step (CSCS docs);\"\n        echo \"[nvshmem]   the engine session is single-task. Skipping (\u00a78.1).\"\n    }\n    if [ \"${NVSHMEM_REQUIRED:-0}\" = \"1\" ]; then\n        rank0 \u0026\u0026 echo \"[nvshmem] NVSHMEM_REQUIRED=1 but step is single-PE \u2014 the harness must launch a dedicated NVSHMEM step\" \u003e\u00262\n        exit 1\n    fi\n    exit 0\nfi\n\n# ---------------------------------------------------------------- run\n# Two complementary measurements (caller sizes the step per test via --ntasks):\n#   alltoall_latency \u2014 round-trip latency, MoE-relevant tail behaviour (N PEs)\n#   shmem_put_bw     \u2014 one-sided put bandwidth, MoE dispatch ceiling (exactly 2 PEs)\n: \"${NVSHMEM_TESTS:=device/coll/alltoall_latency device/pt-to-pt/shmem_put_bw}\"\nrank0 \u0026\u0026 echo \"[nvshmem] using ${BINDIR} (${pes} PE)\"\n\nfail=0\nfor t in ${NVSHMEM_TESTS}; do\n    bin=\"${BINDIR}/${t}\"\n    if [ ! -x \"${bin}\" ]; then\n        rank0 \u0026\u0026 echo \"[nvshmem] missing ${bin} \u2014 skipping\"\n        continue\n    fi\n    rank0 \u0026\u0026 echo \"===== NVSHMEM ${t} (${pes} PE) =====\"\n    # In-step PE: exec the binary directly; SLURM\u0027s --mpi=pmix wires the N tasks\n    # into one N-PE job. `timeout` bounds a PMIx-bootstrap hang (the caller has `|| true`).\n    timeout \"${NVSHMEM_TIMEOUT:-180}\" \"${bin}\" \\\n        || { rank0 \u0026\u0026 echo \"[nvshmem] ${t} failed (non-zero exit)\" \u003e\u00262; fail=1; }\ndone\n\nexit \"${fail}\"\n"
  run-storage.sh: "#!/bin/bash\n#\n# Storage pre-check (SPECIFICATIONS.md \u00a78.1) \u2014 rank 0 only.\n#\n# Reads the DEPLOYED model\u0027s real weight shards off the mount the engine loads from, so the\n# numbers are directly comparable to vLLM\u0027s actual weight load (model_load_weights_s / _gib):\n#\n#   1. Sequential read  \u2014 single-stream O_DIRECT read of the largest shard. The per-stream\n#                         floor of the mount; the stable gate metric.\n#   2. Parallel  read   \u2014 up to N concurrent O_DIRECT streams across distinct shards, bounded\n#                         in total bytes + wall-clock. Mimics vLLM\u0027s parallel shard load and is\n#                         comparable to its effective weight-load bandwidth.\n#\n# The mount is resolved from the actual shard path (\u00a78.1: \"the benchmark depends entirely on\n# where the weights are stored\"): /capstor -\u003e capstor scope, /iopsstor -\u003e iopsstor scope, else\n# the planner-provided fallback. The resolved scope is written to storage_scope.txt so the\n# grader compares against the right reference row.\n#\n# Required env:\n#   PRECHECK_OUT            writable dir for outputs\n# Optional env:\n#   HF_HOME                 weights cache root (shards discovered under it)\n#   MODEL_ID                deployed model id (e.g. org/name) \u2192 targets models--\u003cslug\u003e\n#   PRECHECK_STORAGE_SCOPE  fallback scope when the mount isn\u0027t capstor/iopsstor (e.g. Ceph)\n#   STORAGE_BENCH_FILE      explicit single-stream file (overrides discovery)\n#   STORAGE_SINGLE_GIB      single-stream read size in GiB (default 4)\n#   STORAGE_PARALLEL_STREAMS  max concurrent streams (default 8)\n#   STORAGE_PARALLEL_CAP_GIB  total bytes cap across streams, GiB (default 16)\n#   STORAGE_PARALLEL_TIMEOUT  per-stream timeout seconds (default 90)\n\nset -eo pipefail\n\n: \"${PRECHECK_OUT:?must be set}\"\nmkdir -p \"${PRECHECK_OUT}\"\n\n# ----------------------------------------------------------- discover shards\n# Prefer the deployed model\u0027s snapshot dir; fall back to the largest *.safetensors under HF_HOME.\n# `find -L` / `ls -LS` follow the HF-cache snapshot symlinks into blobs/\u003csha\u003e (the real files).\nSHARD_ROOT=\"${HF_HOME:-}\"\nif [ -n \"${MODEL_ID:-}\" ] \u0026\u0026 [ -n \"${HF_HOME:-}\" ]; then\n    cand=\"${HF_HOME}/hub/models--${MODEL_ID//\\//--}\"\n    [ -d \"${cand}\" ] \u0026\u0026 SHARD_ROOT=\"${cand}\"\nfi\n\nmapfile -t SHARDS \u003c \u003c(find -L \"${SHARD_ROOT}\" -type f -name \u0027*.safetensors\u0027 2\u003e/dev/null \\\n    | xargs -r ls -LS 2\u003e/dev/null)   # largest first\n\nif [ \"${#SHARDS[@]}\" -eq 0 ]; then\n    echo \"[storage] no *.safetensors found under ${SHARD_ROOT:-\u003cunset\u003e} \u2014 skipping storage read (\u00a78.1)\"\n    exit 0\nfi\n\n# ----------------------------------------------------------- resolve mount -\u003e scope\n# Scope strings MUST match tools/system_prechecks_reference.yaml exactly.\nreal0=\"$(readlink -f \"${SHARDS[0]}\" 2\u003e/dev/null || echo \"${SHARDS[0]}\")\"\ncase \"${real0}\" in\n    /capstor/*)  STORAGE_SCOPE=\"capstor weights mount (Lustre, HDD)\" ;;\n    /iopsstor/*) STORAGE_SCOPE=\"iopsstor weights mount (Lustre, flash)\" ;;\n    *)           STORAGE_SCOPE=\"${PRECHECK_STORAGE_SCOPE:-}\" ;;\nesac\nprintf \u0027%s\u0027 \"${STORAGE_SCOPE}\" \u003e \"${PRECHECK_OUT}/storage_scope.txt\"\necho \"[storage] weights on ${real0%%/*}/ \u2192 scope \u0027${STORAGE_SCOPE}\u0027 (${#SHARDS[@]} shards under ${SHARD_ROOT})\"\n\n# ----------------------------------------------------------- 1) sequential (single stream)\nsingle=\"${STORAGE_BENCH_FILE:-${SHARDS[0]}}\"\nsingle_mib=$(( ${STORAGE_SINGLE_GIB:-4} * 1024 ))\nif [ -r \"${single}\" ]; then\n    echo \"[storage] sequential: $(basename \"${single}\") ($((single_mib)) MiB, O_DIRECT)\"\n    dd if=\"${single}\" of=/dev/null bs=1M count=\"${single_mib}\" iflag=direct \\\n        \u003e \"${PRECHECK_OUT}/storage_read.out\" 2\u003e\u00261 || true\nfi\n\n# ----------------------------------------------------------- 2) parallel (aggregate)\nP=\"${STORAGE_PARALLEL_STREAMS:-8}\"\n[ \"${#SHARDS[@]}\" -lt \"${P}\" ] \u0026\u0026 P=\"${#SHARDS[@]}\"\nper_mib=$(( ${STORAGE_PARALLEL_CAP_GIB:-16} * 1024 / P ))   # MiB per stream (total \u2264 cap)\n[ \"${per_mib}\" -lt 1 ] \u0026\u0026 per_mib=1\n\nerrd=\"$(mktemp -d \"${PRECHECK_OUT}/.par.XXXXXX\")\"\ntrap \u0027rm -rf \"${errd}\"\u0027 EXIT\necho \"[storage] parallel: ${P} streams \u00d7 ${per_mib} MiB, O_DIRECT\"\nt0=\"$(date +%s.%N)\"\nfor (( i=0; i\u003cP; i++ )); do\n    timeout \"${STORAGE_PARALLEL_TIMEOUT:-90}\" \\\n        dd if=\"${SHARDS[$i]}\" of=/dev/null bs=1M count=\"${per_mib}\" iflag=direct 2\u003e\"${errd}/${i}.err\" || true \u0026\ndone\nwait\nt1=\"$(date +%s.%N)\"\n\n# Sum the ACTUAL bytes each dd reported (robust to EOF / timeout), compute aggregate GB/s.\nbytes=\"$(awk \u0027{for(i=1;i\u003c=NF;i++) if($i==\"bytes\") s+=$(i-1)} END{printf \"%d\", s+0}\u0027 \"${errd}\"/*.err 2\u003e/dev/null)\"\n{\n    echo \"PARALLEL_READ streams=${P} bytes=${bytes} t0=${t0} t1=${t1}\"\n    awk -v b=\"${bytes}\" -v a=\"${t0}\" -v z=\"${t1}\" \\\n        \u0027BEGIN{d=z-a; if(d\u003c=0) d=1e-6; printf \"seconds=%.4f gbps=%.4f\\n\", d, b/d/1e9}\u0027\n    echo \"--- per-stream dd ---\"\n    cat \"${errd}\"/*.err 2\u003e/dev/null\n} \u003e \"${PRECHECK_OUT}/storage_parallel.out\"\n\nrank0_gbps=\"$(awk -F\u0027gbps=\u0027 \u0027/gbps=/{print $2}\u0027 \"${PRECHECK_OUT}/storage_parallel.out\" | head -1)\"\necho \"[storage] parallel aggregate: ${rank0_gbps:-?} GB/s across ${P} streams\"\n\n# ----------------------------------------------------------- 3) buffered (readahead)\n# Same streams, WITHOUT O_DIRECT: the kernel/Lustre readahead prefetches ahead and pipelines,\n# so this tracks vLLM\u0027s actual (buffered/mmap) weight load far better than the O_DIRECT floor \u2014\n# compare against instances.model_load_weights_gib / model_load_weights_s (\u00a710.2). INFORMATIONAL,\n# not a gate: it is state-dependent (a warm node \u2014 page cache from a prior job \u2014 inflates it).\n# CAVEAT: it reads ~the cap into this node\u0027s page cache, which can speed up the engine\u0027s\n# subsequent weight load (and so understate model_load_weights_s, esp. for small models). Set\n# STORAGE_BUFFERED_READ=0 when a clean cold model-load measurement matters.\nif [ \"${STORAGE_BUFFERED_READ:-1}\" = \"1\" ]; then\n    bufd=\"$(mktemp -d \"${PRECHECK_OUT}/.buf.XXXXXX\")\"\n    echo \"[storage] buffered: ${P} streams \u00d7 ${per_mib} MiB, readahead (no O_DIRECT)\"\n    b0=\"$(date +%s.%N)\"\n    for (( i=0; i\u003cP; i++ )); do\n        timeout \"${STORAGE_PARALLEL_TIMEOUT:-90}\" \\\n            dd if=\"${SHARDS[$i]}\" of=/dev/null bs=1M count=\"${per_mib}\" 2\u003e\"${bufd}/${i}.err\" || true \u0026\n    done\n    wait\n    b1=\"$(date +%s.%N)\"\n    bbytes=\"$(awk \u0027{for(i=1;i\u003c=NF;i++) if($i==\"bytes\") s+=$(i-1)} END{printf \"%d\", s+0}\u0027 \"${bufd}\"/*.err 2\u003e/dev/null)\"\n    {\n        echo \"BUFFERED_READ streams=${P} bytes=${bbytes} t0=${b0} t1=${b1}\"\n        awk -v b=\"${bbytes}\" -v a=\"${b0}\" -v z=\"${b1}\" \\\n            \u0027BEGIN{d=z-a; if(d\u003c=0) d=1e-6; printf \"seconds=%.4f gbps=%.4f\\n\", d, b/d/1e9}\u0027\n        echo \"--- per-stream dd ---\"\n        cat \"${bufd}\"/*.err 2\u003e/dev/null\n    } \u003e \"${PRECHECK_OUT}/storage_buffered.out\"\n    rm -rf \"${bufd}\"\n    buf_gbps=\"$(awk -F\u0027gbps=\u0027 \u0027/gbps=/{print $2}\u0027 \"${PRECHECK_OUT}/storage_buffered.out\" | head -1)\"\n    echo \"[storage] buffered aggregate: ${buf_gbps:-?} GB/s across ${P} streams (readahead; state-dependent)\"\nfi\n"
  run_system_prechecks.sh: "#!/bin/bash\n#\n# System performance pre-checks entry point (SPECIFICATIONS.md \u00a78.2).\n#\n# Runs INSIDE the engine container session, concatenated with the engine\n# launch by the M6 templates:\n#     srun --environment=\u003cedf\u003e bash -c \"run_system_prechecks.sh \u0026\u0026 exec \u003cengine\u003e\"\n# A non-zero exit here stops the chain \u2014 the engine never starts on an\n# aborting gate (\u00a78.4).\n#\n# Required env (rendered by the Planner from the benchmark YAML + global.yaml):\n#   PRECHECK_CLUSTER        e.g. clariden\n#   PRECHECK_SCOPE          reference scope, e.g. \"4\u00d7 GH200, 1 node\"\n#   PRECHECK_OUT            writable dir for captured outputs + results.json\n#   NCCL_TESTS_VERSION      collective_tests_version (\u00a78.2)\n#   NCCL_TESTS_CACHE        collective_tests_cache_dir (\u00a78.2)\n#   MSG_END                 collectives sweep upper bound (e.g. 128M)\n# Optional:\n#   SKIP_SYSTEM_PRECHECKS   1 \u2192 skip everything (\u00a78.5; use sparingly)\n#   PRECHECK_ON_WARN        abort|continue (default abort, \u00a78.4)\n#   PRECHECK_ON_FAIL        abort|continue (default abort, \u00a78.4)\n#   PRECHECK_STORAGE_SCOPE  reference scope of the weights mount\n#   STORAGE_BENCH_FILE      large file on the weights mount to read (storage check\n#                           skipped if unset)\n#   NVSHMEM_REQUIRED        1 \u2192 missing NVSHMEM SDK is a failure (\u00a78.1)\n#\n# Exit codes: 0 proceed | 3 warn+abort | 4 fail+abort | 1 internal error.\n\nset -eo pipefail\n\nTHIS_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" \u0026\u0026 pwd)\"\nrank0() { [ \"${SLURM_PROCID:-0}\" = \"0\" ]; }\n\nif [ \"${SKIP_SYSTEM_PRECHECKS:-0}\" = \"1\" ]; then\n    rank0 \u0026\u0026 echo \"[prechecks] SKIPPED via skip_system_prechecks (\u00a78.5) \u2014 use sparingly\"\n    exit 0\nfi\n\n: \"${PRECHECK_CLUSTER:?must be set}\"\n: \"${PRECHECK_SCOPE:?must be set}\"\n: \"${PRECHECK_OUT:?must be set}\"\n: \"${NCCL_TESTS_VERSION:?must be set}\"\n: \"${NCCL_TESTS_CACHE:?must be set}\"\n: \"${MSG_END:=128M}\"\n\nmkdir -p \"${PRECHECK_OUT}\"\n\n# Launcher fork (\u00a78.2 / decision 9). K8s has no srun/PMIx, so PRECHECK_LAUNCHER=torch runs the\n# torch.distributed collective probe (one rank per GPU via torchrun / Ray) instead of the MPI\n# nccl-tests SLURM uses. Both emit collective_\u003cc\u003e.out rows grade.py reads identically; the\n# storage + grading steps below are launcher-agnostic. NVSHMEM is the MPI path only for now\n# (Ray-NVSHMEM bootstrap deferred, TODOs) \u2014 fine here: K8s single-node dense has no MoE.\nif [ \"${PRECHECK_LAUNCHER:-mpi}\" = \"torch\" ]; then\n    rank0 \u0026\u0026 echo \"[prechecks] launcher=torch \u2014 torch.distributed collective probe (K8s, \u00a78 / decision 9)\"\n    bash \"${THIS_DIR}/run-collectives-torch.sh\" 2\u003e\u00261 | tee \"${PRECHECK_OUT}/collective_probe.log\" \\\n        || echo \"[prechecks] torch collective probe errored \u2014 grade.py marks missing rows fail (\u00a78.4)\"\nelse\n# ------------------------------------------------------- collective binaries\n# Prefer prebuilt nccl-tests baked into the image (the Alps net image ships them in\n# /usr/local/bin); only build \u2014 and risk smoke-test mode on a cold cache \u2014 when no\n# prebuilt set exists (e.g. a stock image). A build cache miss flips the run into\n# smoke-test mode (\u00a78.2): the pipeline runs end-to-end but results are NOT persisted.\n# shellcheck source=_stack-fingerprint.sh\nsource \"${THIS_DIR}/_stack-fingerprint.sh\"\nSMOKE_FLAG=\"\"\nif nccl_tests_prebuilt; then\n    rank0 \u0026\u0026 echo \"[prechecks] using prebuilt nccl-tests from the image: $(nccl_tests_bindir)\"\nelse\n    if [ ! -f \"$(cache_dir_for_stack)/build/.built\" ]; then\n        rank0 \u0026\u0026 echo \"[prechecks] collective-tests cache MISS \u2014 entering smoke-test mode (\u00a78.2)\"\n        SMOKE_FLAG=\"--smoke\"\n    fi\n    bash \"${THIS_DIR}/build-nccl-tests.sh\"\nfi\n\n# ------------------------------------------------------------- collectives\n# run-collectives.sh prints one nccl-tests table per collective; split the capture\n# per collective so grade.py maps files onto reference rows. The set is the\n# deployment\u0027s comm pattern (PRECHECK_COLLECTIVES: TP all-reduce / SP weight-gather /\n# MoE alltoall, + sendrecv for the PP link). rank 0 grades the captured tables, so a\n# per-rank error must NOT abort the run \u2014 the trailing `true` keeps the other PEs\n# alive (this step runs one rank per GPU; \u00a78.2).\nfor c in ${PRECHECK_COLLECTIVES:-all_reduce all_gather alltoall}; do\n    # Every PE runs the binary (one MPI program across the step\u0027s ranks), but only rank 0\n    # captures the table to the shared file \u2014 otherwise N ranks clobber the same path.\n    if rank0; then cap=\"${PRECHECK_OUT}/collective_${c}.out\"; else cap=/dev/null; fi\n    COLLECTIVES=\"$c\" bash \"${THIS_DIR}/run-collectives.sh\" \u003e \"${cap}\" 2\u003e\u00261 \\\n        || { rank0 \u0026\u0026 { echo \"[prechecks] ${c} errored (graded as fail):\"; tail -5 \"${PRECHECK_OUT}/collective_${c}.out\"; }; true; }\ndone\n\n# ------------------------------------------------------------- NVSHMEM / SHMEM\n# alltoall_latency is the MoE-relevant all-to-all collective; it wires up across all\n# PEs of this dedicated step (SLURM PMIx). shmem_put_bw needs EXACTLY 2 PEs (pt-to-pt),\n# which an N-rank step (N\u22654) can\u0027t provide \u2014 deferred to its own 2-rank step (TODOs.md, \u00a78.1).\n# Same rank-0-only capture as the collectives: all PEs run the perftest, rank 0 records it.\nif rank0; then nvcap=\"${PRECHECK_OUT}/nvshmem_alltoall_latency.out\"; else nvcap=/dev/null; fi\nNVSHMEM_TESTS=\"device/coll/alltoall_latency\" \\\n    bash \"${THIS_DIR}/run-nvshmem.sh\" \u003e \"${nvcap}\" 2\u003e\u00261 || true\n# run-nvshmem.sh exits 0 with a warning when the SDK is absent (skipped row,\n# \u00a78.1) unless NVSHMEM_REQUIRED=1, in which case the `|| true` above must not\n# mask it \u2014 re-check explicitly:\nif [ \"${NVSHMEM_REQUIRED:-0}\" = \"1\" ]; then\n    grep -q \"NVSHMEM perftest not found\" \"${PRECHECK_OUT}/nvshmem_alltoall_latency.out\" \u0026\u0026 {\n        rank0 \u0026\u0026 echo \"[prechecks] NVSHMEM required but absent \u2014 fail (\u00a78.1)\" \u003e\u00262\n        exit 4\n    }\nfi\nfi  # end launcher fork (torch | mpi)\n\n# ------------------------------------------------------------- storage read (rank 0)\n# run-storage.sh reads the deployed model\u0027s real shards off their actual mount: a single-stream\n# O_DIRECT floor + a bounded parallel aggregate (vLLM-load-comparable). It resolves the mount \u2192\n# reference scope (capstor/iopsstor/fallback) and writes it to storage_scope.txt (\u00a78.1).\nif rank0; then\n    bash \"${THIS_DIR}/run-storage.sh\" || true\nfi\n\n# ------------------------------------------------------------- grade (rank 0)\nif rank0; then\n    # Prefer the mount-derived scope from run-storage.sh; fall back to the planner default.\n    STORAGE_SCOPE=\"$(cat \"${PRECHECK_OUT}/storage_scope.txt\" 2\u003e/dev/null || true)\"\n    [ -n \"${STORAGE_SCOPE}\" ] || STORAGE_SCOPE=\"${PRECHECK_STORAGE_SCOPE:-}\"\n    python3 \"${THIS_DIR}/grade.py\" \\\n        --out-dir \"${PRECHECK_OUT}\" \\\n        --cluster \"${PRECHECK_CLUSTER}\" \\\n        --scope \"${PRECHECK_SCOPE}\" \\\n        --storage-scope \"${STORAGE_SCOPE}\" \\\n        --on-warn \"${PRECHECK_ON_WARN:-abort}\" \\\n        --on-fail \"${PRECHECK_ON_FAIL:-abort}\" \\\n        ${SMOKE_FLAG} \\\n        --results \"${PRECHECK_OUT}/results.json\"\nfi\n"
  collective_probe.py: "\"\"\"torch.distributed collective-bandwidth probe \u2014 the K8s \u00a78 foundation check\n(SPECIFICATIONS.md \u00a78.2, IMPLEMENTATION_PLAN.md decision 9).\n\nK8s has no `srun`/PMIx, so instead of the MPI nccl-tests SLURM uses, we measure the SAME\nall_reduce / all_gather / alltoall bus bandwidth on vLLM\u0027s own torch+NCCL stack, launched the\nway the engine is on K8s \u2014 one rank per GPU via `torchrun` (single-node / 1 pod) or Ray\nplacement (multi-node, future). The probe body is launcher-agnostic: ranks + rendezvous come\nfrom the env (RANK / WORLD_SIZE / LOCAL_RANK / MASTER_ADDR / MASTER_PORT), which torchrun and\nRay both set.\n\nOutput mimics one nccl-tests out-of-place row per collective (`collective_\u003cname\u003e.out`), so\ngrade.py / the reference table consume it unchanged (grade.parse_nccl_output keys on the size\ncolumn and reads busbw). The launch differs from SLURM\u0027s PMIx nccl-tests, but busbw is\ncomparable for the \u00a716.1 platform overlay (decision 9).\n\nRun (single-node, one pod):\n    torchrun --standalone --nproc-per-node=\u003cgpus\u003e collective_probe.py --out-dir \u003cdir\u003e\n\ntorch is imported lazily inside _run() so the pure helpers below import without it (tested off\nGPU); the measurement itself is validated on-cluster in the engine image (torch 2.x present).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport os\nfrom pathlib import Path\n\n# nccl-tests busbw correction factors (github.com/NVIDIA/nccl-tests \"Performance\"): the wire\n# traffic per rank as a fraction of the buffer, so torch numbers line up with the SLURM rows.\n_BUSBW_FACTORS = {\n    \"all_reduce\": lambda n: 2 * (n - 1) / n,\n    \"all_gather\": lambda n: (n - 1) / n,\n    \"reduce_scatter\": lambda n: (n - 1) / n,\n    \"alltoall\": lambda n: (n - 1) / n,\n}\nSUPPORTED = tuple(_BUSBW_FACTORS)\n\n\ndef busbw_factor(collective: str, world_size: int) -\u003e float:\n    \"\"\"nccl-tests bus-bandwidth factor for `collective` at `world_size` ranks (0 at n\u003c=1:\n    a single rank does no inter-GPU transfer, so busbw is undefined/degenerate).\"\"\"\n    if world_size \u003c= 1:\n        return 0.0\n    return _BUSBW_FACTORS[collective](world_size)\n\n\ndef format_nccl_line(size_bytes: int, time_us: float, algbw_gbs: float, busbw_gbs: float) -\u003e str:\n    \"\"\"One nccl-tests-shaped out-of-place row that grade.parse_nccl_output reads:\n    `size count type redop root time(us) algbw(GB/s) busbw(GB/s) #wrong` (busbw at field 7).\"\"\"\n    count = size_bytes // 4  # float32 elements\n    return (\n        f\"{size_bytes:\u003e13d} {count:\u003e13d}   float     sum      -1 \"\n        f\"{time_us:9.1f} {algbw_gbs:8.2f} {busbw_gbs:8.2f}       0\"\n    )\n\n\ndef _run(args) -\u003e int:\n    import torch\n    import torch.distributed as dist\n\n    rank = int(os.environ.get(\"RANK\", \"0\"))\n    world = int(os.environ.get(\"WORLD_SIZE\", \"1\"))\n    local_rank = int(os.environ.get(\"LOCAL_RANK\", \"0\"))\n    torch.cuda.set_device(local_rank)\n    device = torch.device(\"cuda\", local_rank)\n    dist.init_process_group(backend=\"nccl\")\n\n    out_dir = Path(args.out_dir)\n    out_dir.mkdir(parents=True, exist_ok=True)\n    size = args.bytes\n    n = size // 4  # float32 elements in the (total) message\n\n    def timed(op) -\u003e float:\n        for _ in range(args.warmup):\n            op()\n        torch.cuda.synchronize()\n        dist.barrier()\n        start = torch.cuda.Event(enable_timing=True)\n        end = torch.cuda.Event(enable_timing=True)\n        start.record()\n        for _ in range(args.iters):\n            op()\n        end.record()\n        torch.cuda.synchronize()\n        secs = (start.elapsed_time(end) / 1000.0) / args.iters  # per-iter wall seconds\n        t = torch.tensor([secs], device=device)\n        dist.all_reduce(t, op=dist.ReduceOp.MAX)  # the slowest rank sets the collective time\n        return float(t.item())\n\n    header = (\"#       size(B)         count    type   redop    root   time(us)\"\n              \"    algbw    busbw  #wrong\")\n    for c in args.collectives:\n        if c not in SUPPORTED:\n            if rank == 0:\n                print(f\"[probe] unsupported collective \u0027{c}\u0027 \u2014 skipping\")\n            continue\n        try:\n            if c == \"all_reduce\":\n                buf = torch.ones(n, dtype=torch.float32, device=device)\n                op = lambda buf=buf: dist.all_reduce(buf)\n            elif c == \"all_gather\":\n                inp = torch.ones(n // world, dtype=torch.float32, device=device)\n                out = torch.empty(n, dtype=torch.float32, device=device)\n                op = lambda out=out, inp=inp: dist.all_gather_into_tensor(out, inp)\n            else:  # alltoall\n                inp = torch.ones(n, dtype=torch.float32, device=device)\n                out = torch.empty(n, dtype=torch.float32, device=device)\n                op = lambda out=out, inp=inp: dist.all_to_all_single(out, inp)\n            secs = timed(op)\n            algbw = size / secs / 1e9  # GB/s\n            busbw = algbw * busbw_factor(c, world)\n            if rank == 0:\n                line = format_nccl_line(size, secs * 1e6, algbw, busbw)\n                (out_dir / f\"collective_{c}.out\").write_text(header + \"\\n\" + line + \"\\n\")\n                print(f\"[probe] {c}: algbw={algbw:.2f} busbw={busbw:.2f} GB/s \"\n                      f\"@ {size} B over {world} ranks\")\n        except Exception as exc:  # a failed collective leaves no file \u2192 grade.py marks it fail\n            if rank == 0:\n                print(f\"[probe] {c} FAILED: {exc}\")\n\n    dist.barrier()\n    dist.destroy_process_group()\n    return 0\n\n\ndef main() -\u003e int:\n    p = argparse.ArgumentParser(description=\"torch.distributed collective-bandwidth probe (\u00a78, K8s)\")\n    p.add_argument(\"--collectives\", default=\"all_reduce all_gather alltoall\",\n                   help=\"space-separated subset of: \" + \" \".join(SUPPORTED))\n    p.add_argument(\"--bytes\", type=int, default=128 * 1024**2, help=\"message size (default 128 MiB)\")\n    p.add_argument(\"--warmup\", type=int, default=5)\n    p.add_argument(\"--iters\", type=int, default=20)\n    p.add_argument(\"--out-dir\", required=True)\n    args = p.parse_args()\n    args.collectives = args.collectives.split()\n    return _run(args)\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"
  grade.py: "\"\"\"Parse + grade system pre-check measurements (SPECIFICATIONS.md \u00a78.3-\u00a78.4).\n\nConsumes the raw benchmark outputs captured by run_system_prechecks.sh, parses\nper-metric values, grades them against tools/system_prechecks_reference.yaml,\nand emits JSON rows shaped for the `system_prechecks` table (\u00a714.6) plus an\noverall gate outcome.\n\nGrading (\u00a78.3/\u00a78.4):\n- tolerance_pct \u003c 0 (higher is better): warn when measured \u003c (1+tol/100)\u00b7expected;\n  fail when measured \u003c 0.5\u00b7expected.\n- tolerance_pct \u003e 0 (lower is better): warn when measured \u003e (1+tol/100)\u00b7expected;\n  fail when measured \u003e 2\u00b7expected.\n- expected TBD / no matching reference: informational \u2014 recorded with\n  expected=None and status \"pass\" (the gate is unenforceable, \u00a78.3).\n- benchmark errored / output unparseable: status \"fail\" with measured=None.\n\nExit codes (consumed by run_system_prechecks.sh in the `\u0026\u0026 exec \u003cengine\u003e` chain):\n0 = proceed; 3 = warn + on_warn=abort; 4 = fail + on_fail=abort.\n\nNVSHMEM perftest output shapes vary across SDK versions; the parsers here are\ndeliberately tolerant and the fixtures must be re-captured from the real engine\nimage at E1 (same discipline as the vLLM log parser).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport re\nimport sys\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nimport yaml\n\nREFERENCE_PATH = Path(__file__).resolve().parents[2] / \"system_prechecks_reference.yaml\"\n\n_SIZE_UNITS = {\"B\": 1, \"KiB\": 1024, \"MiB\": 1024**2, \"GiB\": 1024**3}\n_BW_TO_GBS = {\"GB/s\": 1.0, \"MB/s\": 1e-3, \"KB/s\": 1e-6}\n\n\ndef size_label_to_bytes(label: str) -\u003e int | None:\n    m = re.match(r\"\\s*([\\d.]+)\\s*(B|KiB|MiB|GiB)\\b\", label)\n    return int(float(m.group(1)) * _SIZE_UNITS[m.group(2)]) if m else None\n\n\n# ------------------------------------------------------------------- parsers\n\n\ndef parse_nccl_output(text: str, target_bytes: int) -\u003e float | None:\n    \"\"\"Out-of-place busbw (GB/s) at the target message size from nccl-tests output.\"\"\"\n    for line in text.splitlines():\n        parts = line.split()\n        if len(parts) \u003e= 9 and parts[0].isdigit() and int(parts[0]) == target_bytes:\n            try:\n                return float(parts[7])  # size count type redop root time algbw busbw ...\n            except ValueError:\n                return None\n    return None\n\n\ndef parse_nvshmem_output(text: str, target_bytes: int, want: str = \"latency\") -\u003e float | None:\n    \"\"\"Value at the target message-size row of an NVSHMEM perftest table.\n\n    The perftest prints one or more tables under a header like:\n        size(B)  count  type  scope  latency(us)  algbw(GB/s)  busbw(GB/s)\n    `want` selects the column: \"latency\" -\u003e latency(us); \"bw\" -\u003e busbw/bandwidth.\n    The column index is taken from the header (robust to spacing/layout), and the\n    last matching table wins (the final / most-representative scope).\n    \"\"\"\n    col = None\n    found = None\n    for line in text.splitlines():\n        parts = line.split()\n        if not parts:\n            continue\n        if parts[0].startswith(\"size(\"):  # header row -\u003e (re)locate the wanted column\n            col = next(\n                (i for i, name in enumerate(parts)\n                 if (want == \"latency\" and name.startswith(\"latency\"))\n                 or (want == \"bw\" and (\"busbw\" in name or name.startswith(\"bw\")))),\n                None,\n            )\n            continue\n        if col is None:\n            continue\n        try:\n            size = int(float(parts[0]))\n            value = float(parts[col])\n        except (ValueError, IndexError):\n            continue\n        if size == target_bytes:\n            found = value\n    return found\n\n\ndef parse_dd_output(text: str) -\u003e float | None:\n    \"\"\"Read bandwidth (GB/s) from dd\u0027s summary line.\"\"\"\n    m = re.search(r\"copied,\\s*[\\d.]+\\s*s,\\s*([\\d.]+)\\s*(GB/s|MB/s|KB/s)\", text)\n    if not m:\n        return None\n    return float(m.group(1)) * _BW_TO_GBS[m.group(2)]\n\n\ndef parse_storage_parallel(text: str) -\u003e float | None:\n    \"\"\"Aggregate read bandwidth (GB/s) from run-storage.sh\u0027s parallel summary line\n    (`PARALLEL_READ \u2026 gbps=\u003cG\u003e`) \u2014 bytes read across all streams / wall-clock.\"\"\"\n    m = re.search(r\"gbps=([\\d.]+)\", text)\n    return float(m.group(1)) if m else None\n\n\ndef nvshmem_max_busbw(text: str) -\u003e float:\n    \"\"\"Largest busbw(GB/s) across every NVSHMEM perftest row.\n\n    busbw is derived from algbw and the PE count, so it is identically 0 when the\n    run wired up a single PE (the 2(n-1)/n factor is 0 at n=1). A whole-table max\n    of 0 is therefore a reliable \"degenerate single-PE run\" signal \u2014 the latency\n    column is then a local copy, not a real collective (see parse_nvshmem_output\n    for the table layout).\"\"\"\n    col = None\n    best = 0.0\n    for line in text.splitlines():\n        parts = line.split()\n        if not parts:\n            continue\n        if parts[0].startswith(\"size(\"):\n            col = next((i for i, n in enumerate(parts) if \"busbw\" in n), None)\n            continue\n        if col is None:\n            continue\n        try:\n            best = max(best, float(parts[col]))\n        except (ValueError, IndexError):\n            continue\n    return best\n\n\n# ------------------------------------------------------------------- grading\n\n\ndef load_reference(cluster: str, path: Path = REFERENCE_PATH) -\u003e list[dict]:\n    with open(path) as f:\n        rows = yaml.safe_load(f)\n    return [r for r in rows if r[\"cluster\"] == cluster]\n\n\ndef _expected_value(raw) -\u003e float | None:\n    m = re.match(r\"\\s*([\\d.]+)\", str(raw))\n    return float(m.group(1)) if m else None  # \"TBD ...\" -\u003e None (informational)\n\n\ndef find_reference(refs: list[dict], benchmark: str, scope: str) -\u003e dict | None:\n    for r in refs:\n        if r[\"benchmark\"] == benchmark and r[\"scope\"] == scope:\n            return r\n    return None\n\n\ndef grade(measured: float | None, expected: float | None, tolerance_pct: float | None) -\u003e str:\n    if measured is None:\n        return \"fail\"  # \u00a78.4: the benchmark itself errored\n    if expected is None or tolerance_pct is None:\n        return \"pass\"  # informational \u2014 gate unenforceable until characterised (\u00a78.3)\n    if tolerance_pct \u003c 0:  # higher is better\n        if measured \u003c 0.5 * expected:\n            return \"fail\"\n        if measured \u003c (1 + tolerance_pct / 100) * expected:\n            return \"warn\"\n    else:  # lower is better\n        if measured \u003e 2 * expected:\n            return \"fail\"\n        if measured \u003e (1 + tolerance_pct / 100) * expected:\n            return \"warn\"\n    return \"pass\"\n\n\ndef metric_id(benchmark: str, size_label: str) -\u003e str:\n    slug = re.sub(r\"[^a-z0-9]+\", \"_\", f\"{benchmark} {size_label}\".lower()).strip(\"_\")\n    return slug\n\n\ndef build_rows(measurements: list[dict], refs: list[dict]) -\u003e list[dict]:\n    \"\"\"measurements: [{benchmark, scope, size, measured}, ...] -\u003e \u00a714.6 rows.\"\"\"\n    ts = datetime.now(timezone.utc).isoformat()\n    rows = []\n    for m in measurements:\n        ref = find_reference(refs, m[\"benchmark\"], m[\"scope\"])\n        expected = _expected_value(ref[\"expected\"]) if ref else None\n        tolerance = ref.get(\"tolerance_pct\") if ref else None\n        rows.append(\n            {\n                \"metric\": metric_id(m[\"benchmark\"], m[\"size\"]),\n                \"measured\": m[\"measured\"],\n                \"expected\": expected,\n                \"tolerance_pct\": tolerance if expected is not None else None,\n                \"status\": grade(m[\"measured\"], expected, tolerance if expected is not None else None),\n                \"ts\": ts,\n            }\n        )\n    return rows\n\n\ndef outcome_exit_code(rows: list[dict], on_warn: str, on_fail: str) -\u003e int:\n    statuses = {r[\"status\"] for r in rows}\n    if \"fail\" in statuses and on_fail == \"abort\":\n        return 4\n    if \"warn\" in statuses and on_warn == \"abort\":\n        return 3\n    return 0\n\n\n# ----------------------------------------------------------------------- CLI\n\n\ndef collect_measurements(out_dir: Path, cluster: str, scope: str, storage_scope: str, refs: list[dict]) -\u003e list[dict]:\n    \"\"\"Map captured output files onto reference benchmark names.\"\"\"\n    is_amd = any(r[\"benchmark\"].startswith(\"RCCL\") for r in refs)\n    coll_prefix = \"RCCL\" if is_amd else \"NCCL\"\n    shmem_prefix = \"ROCm SHMEM\" if is_amd else \"NVSHMEM\"\n    measurements = []\n\n    for path in sorted(out_dir.glob(\"collective_*.out\")):\n        name = path.stem.removeprefix(\"collective_\")\n        benchmark = f\"{coll_prefix} {name}\"\n        ref = find_reference(refs, benchmark, scope)\n        size_label = ref[\"size\"] if ref else \"128 MiB\"\n        target = size_label_to_bytes(size_label) or 128 * 1024**2\n        measurements.append(\n            {\"benchmark\": benchmark, \"scope\": scope, \"size\": size_label,\n             \"measured\": parse_nccl_output(path.read_text(), target)}\n        )\n    for path, suffix, want, default_size in [\n        (out_dir / \"nvshmem_alltoall_latency.out\", \"alltoall_latency\", \"latency\", \"128 KiB\"),\n        (out_dir / \"nvshmem_put_bw.out\", \"shmem_put_bw\", \"bw\", \"128 MiB\"),\n    ]:\n        if not path.exists():\n            continue  # skipped-with-warning path (\u00a78.1) \u2014 no row, orchestrator logs it\n        text = path.read_text()\n        if \"perftest not found\" in text or not text.strip():\n            # \u00a78.1 skip: the runner tees the warning into the capture file, so\n            # absence-of-file is not the only skip signal \u2014 content is.\n            continue\n        if \"requires exactly\" in text or nvshmem_max_busbw(text) == 0.0:\n            # Degenerate single-PE run: the perftest wired up only 1 PE (PMIx\n            # bootstrap failed). A collective then reports busbw \u2261 0 and a\n            # pt-to-pt test aborts with \"requires exactly two processes\" \u2014 either\n            # way the value is not a real multi-PE measurement, so skip the row\n            # rather than record a misleading number (\u00a78.1). run-nvshmem.sh logs\n            # the cause into the captured .out.\n            continue\n        benchmark = f\"{shmem_prefix} {suffix}\"\n        ref = find_reference(refs, benchmark, scope)\n        size_label = ref[\"size\"] if ref else default_size\n        target = size_label_to_bytes(size_label) or size_label_to_bytes(default_size)\n        measurements.append(\n            {\"benchmark\": benchmark, \"scope\": scope, \"size\": size_label,\n             \"measured\": parse_nvshmem_output(text, target, want)}\n        )\n    storage = out_dir / \"storage_read.out\"\n    if storage.exists():\n        measurements.append(\n            {\"benchmark\": \"Sequential read\", \"scope\": storage_scope, \"size\": \"1 MiB blocks\",\n             \"measured\": parse_dd_output(storage.read_text())}\n        )\n    # Parallel aggregate read (vLLM-load-comparable, \u00a78.1). find_reference matches on\n    # benchmark+scope, so the \"aggregate\" size label only shapes the metric slug.\n    storage_par = out_dir / \"storage_parallel.out\"\n    if storage_par.exists():\n        measurements.append(\n            {\"benchmark\": \"Parallel read\", \"scope\": storage_scope, \"size\": \"aggregate\",\n             \"measured\": parse_storage_parallel(storage_par.read_text())}\n        )\n    # Buffered (readahead) aggregate \u2014 informational (no reference row): state-dependent, but the\n    # closest proxy to vLLM\u0027s actual buffered weight load (\u00a78.1, \u00a710.2).\n    storage_buf = out_dir / \"storage_buffered.out\"\n    if storage_buf.exists():\n        measurements.append(\n            {\"benchmark\": \"Buffered read\", \"scope\": storage_scope, \"size\": \"aggregate\",\n             \"measured\": parse_storage_parallel(storage_buf.read_text())}\n        )\n    return measurements\n\n\ndef main() -\u003e int:\n    parser = argparse.ArgumentParser(description=\"Grade \u00a78 pre-check outputs\")\n    parser.add_argument(\"--out-dir\", type=Path, required=True, help=\"dir with captured *.out files\")\n    parser.add_argument(\"--cluster\", required=True)\n    parser.add_argument(\"--scope\", required=True, help=\u0027reference scope, e.g. \"4\u00d7 GH200, 1 node\"\u0027)\n    parser.add_argument(\"--storage-scope\", default=\"\", help=\"reference scope of the weights mount\")\n    parser.add_argument(\"--reference\", type=Path, default=REFERENCE_PATH)\n    parser.add_argument(\"--on-warn\", choices=[\"abort\", \"continue\"], default=\"abort\")\n    parser.add_argument(\"--on-fail\", choices=[\"abort\", \"continue\"], default=\"abort\")\n    parser.add_argument(\"--smoke\", action=\"store_true\", help=\"smoke-test mode flag (\u00a78.2 cache miss)\")\n    parser.add_argument(\"--results\", type=Path, required=True, help=\"output JSON path\")\n    args = parser.parse_args()\n\n    refs = load_reference(args.cluster, args.reference)\n    measurements = collect_measurements(args.out_dir, args.cluster, args.scope, args.storage_scope, refs)\n    rows = build_rows(measurements, refs)\n    code = outcome_exit_code(rows, args.on_warn, args.on_fail)\n    payload = {\n        \"cluster\": args.cluster,\n        \"scope\": args.scope,\n        \"smoke_test_mode\": args.smoke,\n        \"gate_exit_code\": code,\n        \"rows\": rows,\n    }\n    args.results.write_text(json.dumps(payload, indent=2, sort_keys=True) + \"\\n\")\n    for row in rows:\n        print(f\"[prechecks] {row[\u0027status\u0027]:4s} {row[\u0027metric\u0027]}: measured={row[\u0027measured\u0027]} expected={row[\u0027expected\u0027]}\")\n    if args.smoke:\n        print(\"[prechecks] SMOKE-TEST MODE: collective-tests cache was cold \u2014 results will NOT be persisted (\u00a78.2)\")\n    return code\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"
  hw_sampler.py: "#!/usr/bin/env python3\n\"\"\"Hardware telemetry sampler (SPECIFICATIONS.md \u00a713.3) \u2014 single-file, stdlib-only.\n\nRuns ON the inference-server nodes, backgrounded inside the engine container\nsession before `exec \u003cengine\u003e` (plan M3/M6; review finding H3). Therefore:\nNO third-party imports, NO repo imports \u2014 it must execute in any engine image\nwith a bare python3. Signals a platform cannot expose are emitted as null and\nstored as NULL (\u00a713.3).\n\nOutput: NDJSON, one node-scoped row (gpu_index=null) plus one row per GPU per\ntick. Ingested into `hardware_stats` by the Benchmarker at finalisation\n(tools/common/results_db.py ingest_hardware_ndjson).\n\nUsage:\n    python3 hw_sampler.py --out /scratch/\u003crun\u003e/hw-$(hostname).ndjson \\\n        [--interval 1.0] [--duration 3600]\n\nDCGM profiling counters (sm/tensor activity, DRAM/NVLink/PCIe bandwidth) are\nemitted as null in this version: wiring `dcgmi dmon` blind \u2014 with no GH200 to\nvalidate the parse against \u2014 would violate the parser-fixture discipline. They\nget wired and fixture-tested at E1 on a real node (plan M3 DoD). `rocm-smi`\nsupport is best-effort until beverin runs.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport datetime\nimport json\nimport re\nimport socket\nimport subprocess\nimport sys\nimport time\n\nGPU_FIELDS = (\n    \"gpu_util_pct\", \"gpu_mem_used_gb\", \"gpu_mem_pct\", \"gpu_power_w\", \"gpu_temp_c\",\n    \"gpu_sm_active_pct\", \"gpu_tensor_active_pct\", \"gpu_dram_bw_gbs\",\n    \"nvlink_rx_gbs\", \"nvlink_tx_gbs\", \"pcie_rx_gbs\", \"pcie_tx_gbs\",\n)\nNODE_FIELDS = (\n    \"cpu_util_pct\", \"cpu_iowait_pct\", \"ram_used_gb\", \"ram_pct\", \"ram_bw_gbs\",\n    \"storage_read_gbs\", \"storage_read_iops\", \"net_rx_gbs\", \"net_tx_gbs\",\n)\n\n_PARTITION_RE = re.compile(r\"^(sd[a-z]+\\d+|nvme\\d+n\\d+p\\d+|mmcblk\\d+p\\d+)$\")\n_SKIP_DEV_RE = re.compile(r\"^(loop|ram|zram|dm-|md)\")\n\n\n# ----------------------------------------------------------- /proc parsers\n# Pure functions over file contents -\u003e testable on any platform.\n\n\ndef parse_proc_stat(text: str) -\u003e tuple[int, int, int] | None:\n    \"\"\"Returns (busy_ticks, iowait_ticks, total_ticks) from the aggregate cpu line.\"\"\"\n    for line in text.splitlines():\n        if line.startswith(\"cpu \"):\n            parts = [int(x) for x in line.split()[1:]]\n            if len(parts) \u003c 5:\n                return None  # malformed aggregate cpu line\n            idle, iowait = parts[3], parts[4]\n            total = sum(parts)\n            return total - idle - iowait, iowait, total\n    return None\n\n\ndef cpu_pcts(prev: tuple | None, cur: tuple | None) -\u003e tuple[float | None, float | None]:\n    if not prev or not cur or cur[2] \u003c= prev[2]:\n        return None, None\n    dtotal = cur[2] - prev[2]\n    return 100.0 * (cur[0] - prev[0]) / dtotal, 100.0 * (cur[1] - prev[1]) / dtotal\n\n\ndef parse_meminfo(text: str) -\u003e tuple[float | None, float | None]:\n    \"\"\"(ram_used_gb, ram_pct) from MemTotal/MemAvailable.\"\"\"\n    values: dict[str, int] = {}\n    for line in text.splitlines():\n        parts = line.split()\n        if parts and parts[0].rstrip(\":\") in (\"MemTotal\", \"MemAvailable\"):\n            values[parts[0].rstrip(\":\")] = int(parts[1])  # kB\n    if \"MemTotal\" not in values or \"MemAvailable\" not in values:\n        return None, None\n    used_kb = values[\"MemTotal\"] - values[\"MemAvailable\"]\n    return used_kb / 1024**2, 100.0 * used_kb / values[\"MemTotal\"]\n\n\ndef parse_diskstats(text: str) -\u003e tuple[int, int]:\n    \"\"\"(reads_completed, sectors_read) summed over physical, non-partition devices.\"\"\"\n    reads = sectors = 0\n    for line in text.splitlines():\n        parts = line.split()\n        if len(parts) \u003c 7:\n            continue\n        name = parts[2]\n        if _SKIP_DEV_RE.match(name) or _PARTITION_RE.match(name):\n            continue\n        reads += int(parts[3])\n        sectors += int(parts[5])\n    return reads, sectors\n\n\ndef parse_net_dev(text: str) -\u003e tuple[int, int]:\n    \"\"\"(rx_bytes, tx_bytes) summed over non-loopback interfaces.\"\"\"\n    rx = tx = 0\n    for line in text.splitlines():\n        if \":\" not in line:\n            continue\n        name, rest = line.split(\":\", 1)\n        if name.strip() == \"lo\":\n            continue\n        parts = rest.split()\n        rx += int(parts[0])\n        tx += int(parts[8])\n    return rx, tx\n\n\ndef _read(path: str) -\u003e str | None:\n    try:\n        with open(path) as f:\n            return f.read()\n    except OSError:\n        return None\n\n\n# ------------------------------------------------------------ GPU queries\n\n\n_NVSMI_QUERY = \"utilization.gpu,memory.used,memory.total,power.draw,temperature.gpu\"\n\n\ndef parse_nvidia_smi_csv(text: str) -\u003e list[dict]:\n    \"\"\"Rows from `nvidia-smi --query-gpu=... --format=csv,noheader,nounits`.\"\"\"\n    rows = []\n    for line in text.strip().splitlines():\n        parts = [p.strip() for p in line.split(\",\")]\n        if len(parts) != 5:\n            continue\n        util, mem_used, mem_total, power, temp = (_maybe_float(p) for p in parts)\n        rows.append(\n            {\n                \"gpu_util_pct\": util,\n                \"gpu_mem_used_gb\": mem_used / 1024 if mem_used is not None else None,\n                \"gpu_mem_pct\": (\n                    100.0 * mem_used / mem_total\n                    if mem_used is not None and mem_total\n                    else None\n                ),\n                \"gpu_power_w\": power,\n                \"gpu_temp_c\": temp,\n            }\n        )\n    return rows\n\n\ndef _maybe_float(value: str) -\u003e float | None:\n    try:\n        return float(value)\n    except ValueError:  # nvidia-smi prints \"[N/A]\" for unsupported fields\n        return None\n\n\ndef _run(cmd: list[str], timeout: float = 5.0) -\u003e str | None:\n    try:\n        proc = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)\n    except (OSError, subprocess.TimeoutExpired):\n        return None\n    return proc.stdout if proc.returncode == 0 else None\n\n\ndef query_gpus() -\u003e list[dict]:\n    out = _run([\"nvidia-smi\", f\"--query-gpu={_NVSMI_QUERY}\", \"--format=csv,noheader,nounits\"])\n    if out is not None:\n        return parse_nvidia_smi_csv(out)\n    # AMD path (best-effort until validated on beverin): rocm-smi JSON\n    out = _run([\"rocm-smi\", \"--showuse\", \"--showmemuse\", \"--showpower\", \"--showtemp\", \"--json\"])\n    if out is not None:\n        return _parse_rocm_smi_json(out)\n    return []\n\n\ndef _parse_rocm_smi_json(text: str) -\u003e list[dict]:\n    try:\n        data = json.loads(text)\n    except json.JSONDecodeError:\n        return []\n    rows = []\n    for key in sorted(k for k in data if k.startswith(\"card\")):\n        card = data[key]\n\n        def grab(*names):\n            for n in names:\n                for k, v in card.items():\n                    if n.lower() in k.lower():\n                        try:\n                            return float(str(v).rstrip(\"%W\u00b0 c\"))\n                        except ValueError:\n                            pass\n            return None\n\n        rows.append(\n            {\n                \"gpu_util_pct\": grab(\"GPU use\"),\n                \"gpu_mem_used_gb\": None,\n                \"gpu_mem_pct\": grab(\"GPU Memory Allocated\", \"GPU memory use\"),\n                \"gpu_power_w\": grab(\"Average Graphics Package Power\", \"Current Socket Graphics Package Power\"),\n                \"gpu_temp_c\": grab(\"Temperature (Sensor junction)\", \"Temperature (Sensor edge)\"),\n            }\n        )\n    return rows\n\n\n# --------------------------------------------------------------- sampler\n\n\nclass Sampler:\n    def __init__(self) -\u003e None:\n        self.node = socket.gethostname()\n        self._prev_cpu: tuple | None = None\n        self._prev_disk: tuple[int, int] | None = None\n        self._prev_net: tuple[int, int] | None = None\n        self._prev_t: float | None = None\n\n    def tick(self) -\u003e list[dict]:\n        now = time.monotonic()\n        ts = datetime.datetime.now(datetime.timezone.utc).isoformat()\n        dt = now - self._prev_t if self._prev_t is not None else None\n\n        node_row: dict = {\"ts\": ts, \"node\": self.node, \"gpu_index\": None}\n        node_row.update({f: None for f in NODE_FIELDS})\n        node_row.update({f: None for f in GPU_FIELDS})\n\n        stat = _read(\"/proc/stat\")\n        cur_cpu = parse_proc_stat(stat) if stat else None\n        util, iowait = cpu_pcts(self._prev_cpu, cur_cpu)\n        node_row[\"cpu_util_pct\"], node_row[\"cpu_iowait_pct\"] = util, iowait\n        self._prev_cpu = cur_cpu\n\n        meminfo = _read(\"/proc/meminfo\")\n        if meminfo:\n            node_row[\"ram_used_gb\"], node_row[\"ram_pct\"] = parse_meminfo(meminfo)\n\n        disk = _read(\"/proc/diskstats\")\n        if disk:\n            cur_disk = parse_diskstats(disk)\n            if self._prev_disk and dt and dt \u003e 0:\n                node_row[\"storage_read_iops\"] = (cur_disk[0] - self._prev_disk[0]) / dt\n                node_row[\"storage_read_gbs\"] = (cur_disk[1] - self._prev_disk[1]) * 512 / dt / 1e9\n            self._prev_disk = cur_disk\n\n        net = _read(\"/proc/net/dev\")\n        if net:\n            cur_net = parse_net_dev(net)\n            if self._prev_net and dt and dt \u003e 0:\n                node_row[\"net_rx_gbs\"] = (cur_net[0] - self._prev_net[0]) / dt / 1e9\n                node_row[\"net_tx_gbs\"] = (cur_net[1] - self._prev_net[1]) / dt / 1e9\n            self._prev_net = cur_net\n\n        self._prev_t = now\n        rows = [node_row]\n        for index, gpu in enumerate(query_gpus()):\n            gpu_row = {\"ts\": ts, \"node\": self.node, \"gpu_index\": index}\n            gpu_row.update({f: None for f in GPU_FIELDS})\n            gpu_row.update({f: None for f in NODE_FIELDS})\n            gpu_row.update(gpu)\n            rows.append(gpu_row)\n        return rows\n\n\ndef main() -\u003e int:\n    parser = argparse.ArgumentParser(description=\"\u00a713.3 hardware sampler (stdlib-only)\")\n    parser.add_argument(\"--out\", required=True)\n    parser.add_argument(\"--interval\", type=float, default=1.0)\n    parser.add_argument(\"--duration\", type=float, default=None, help=\"seconds; default: until killed\")\n    args = parser.parse_args()\n\n    sampler = Sampler()\n    start = time.monotonic()\n    with open(args.out, \"a\", buffering=1) as out:\n        while args.duration is None or time.monotonic() - start \u003c args.duration:\n            tick_started = time.monotonic()\n            for row in sampler.tick():\n                out.write(json.dumps(row, sort_keys=True) + \"\\n\")\n            sleep_s = args.interval - (time.monotonic() - tick_started)\n            if sleep_s \u003e 0:\n                time.sleep(sleep_s)\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"
  system_prechecks_reference.yaml: "# tools/system_prechecks_reference.yaml\n#\n# Per-system reference values for the system performance pre-checks (SPECIFICATIONS.md \u00a78).\n# This file is the authoritative ground truth: \u00a78.4 grades each pre-check measurement as\n# pass / warn / fail by comparing it against the matching entry below.\n#\n# Entry shape: { cluster, scope, benchmark, size, expected, tolerance_pct, source }.\n# tolerance_pct conventions:\n#   negative \u2192 warn / fail if measured BELOW expected (bandwidth, throughput)\n#   positive \u2192 warn / fail if measured ABOVE expected (latency)\n#\n# Status: all entries are placeholders until first characterisation runs on each system.\n# Until populated, the foundation gate is unenforceable \u2014 measurements log as informational.\n\n# \u2500\u2500 clariden (NVIDIA GH200 \u2014 4 GPUs / node) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n- { cluster: clariden, scope: \"4\u00d7 GH200, 1 node\",  benchmark: NCCL all_reduce,           size: 128 MiB, expected: 317.7 GB/s busbw, tolerance_pct: -10, source: \"E2a 2026-06-14 (first characterisation, mean of 2 runs: 316.73, 318.65)\" }\n- { cluster: clariden, scope: \"4\u00d7 GH200, 1 node\",  benchmark: NCCL all_gather,           size: 128 MiB, expected: 283.5 GB/s busbw, tolerance_pct: -10, source: \"E2a 2026-06-14 (first characterisation, mean of 2 runs: 283.55, 283.43)\" }\n- { cluster: clariden, scope: \"4\u00d7 GH200, 1 node\",  benchmark: NCCL alltoall,             size: 128 MiB, expected: 306.2 GB/s busbw, tolerance_pct: -10, source: \"E2a 2026-06-14 (first characterisation, mean of 2 runs: 307.75, 304.57)\" }\n# NVSHMEM stays TBD: perftest needs a dedicated multi-task `srun --mpi=pmix` step it cannot get\n# inside the engine\u0027s single-task session \u2014 uncharacterised pending that step (TODOs.md, \u00a78.1).\n- { cluster: clariden, scope: \"4\u00d7 GH200, 1 node\",  benchmark: NVSHMEM alltoall_latency,  size: 128 KiB, expected: TBD \u00b5s,         tolerance_pct: +20, source: TBD }\n- { cluster: clariden, scope: \"4\u00d7 GH200, 1 node\",  benchmark: NVSHMEM shmem_put_bw,      size: 128 MiB, expected: TBD GB/s,       tolerance_pct: -10, source: TBD }\n# Inter-node over Slingshot-11 (vs intra-node NVLink at the 1-node scope) \u2014 sensibly lower.\n# E2b 2026-06-15, mean of 2 runs (all_reduce 131.56/130.64, all_gather 86.51/86.44,\n# alltoall 39.16/37.45, sendrecv 23.73/23.35, NVSHMEM 49.60/46.29 \u00b5s).\n- { cluster: clariden, scope: \"8\u00d7 GH200, 2 nodes\", benchmark: NCCL all_reduce,           size: 128 MiB, expected: 131.1 GB/s busbw, tolerance_pct: -10, source: \"E2b 2026-06-15 (mean of 2 runs)\" }\n- { cluster: clariden, scope: \"8\u00d7 GH200, 2 nodes\", benchmark: NCCL all_gather,           size: 128 MiB, expected: 86.5 GB/s busbw,  tolerance_pct: -10, source: \"E2b 2026-06-15 (mean of 2 runs)\" }\n- { cluster: clariden, scope: \"8\u00d7 GH200, 2 nodes\", benchmark: NCCL alltoall,             size: 128 MiB, expected: 38.3 GB/s busbw,  tolerance_pct: -10, source: \"E2b 2026-06-15 (mean of 2 runs)\" }\n# sendrecv = the inter-node point-to-point link the PP boundary uses (TP4\u00d7PP2); populated by E2b.\n- { cluster: clariden, scope: \"8\u00d7 GH200, 2 nodes\", benchmark: NCCL sendrecv,            size: 128 MiB, expected: 23.5 GB/s busbw,  tolerance_pct: -10, source: \"E2b 2026-06-15 (mean of 2 runs); \u2248 one Slingshot-11 NIC\" }\n- { cluster: clariden, scope: \"8\u00d7 GH200, 2 nodes\", benchmark: NVSHMEM alltoall_latency,  size: 128 KiB, expected: 47.9 \u00b5s,         tolerance_pct: +20, source: \"E2b 2026-06-15 (mean of 2 runs)\" }\n- { cluster: clariden, scope: \"8\u00d7 GH200, 2 nodes\", benchmark: NVSHMEM shmem_put_bw,      size: 128 MiB, expected: TBD GB/s,       tolerance_pct: -10, source: TBD }\n# Single-stream O_DIRECT read of a real Apertus-8B safetensors blob (4 GiB). Measured 62.9 MB/s\n# at E2a, but capstor was under general slowness then (operator-confirmed), so this is NOT a\n# representative baseline \u2014 a conservative floor only, pending re-characterisation in a later\n# phase (TODOs.md). A healthy capstor reads faster, so the -15% band won\u0027t false-fail; vLLM\u0027s\n# parallel shard loads also aggregate higher than this single-stream floor.\n# Sequential read = single-stream O_DIRECT floor; Parallel read = aggregate over concurrent\n# streams (vLLM-load-comparable, \u00a78.1). The scope is derived at runtime from where the weights\n# actually live (capstor vs iopsstor), so the matching row below is what grades the run.\n- { cluster: clariden, scope: \"capstor weights mount (Lustre, HDD)\",  benchmark: Sequential read, size: 1 MiB blocks, expected: 0.063 GB/s, tolerance_pct: -15, source: \"E2a 2026-06-14 (single sample during capstor degradation \u2014 re-characterise)\" }\n- { cluster: clariden, scope: \"capstor weights mount (Lustre, HDD)\",  benchmark: Parallel read,   size: aggregate,    expected: TBD GB/s, tolerance_pct: -15, source: TBD }\n- { cluster: clariden, scope: \"iopsstor weights mount (Lustre, flash)\", benchmark: Sequential read, size: 1 MiB blocks, expected: TBD GB/s, tolerance_pct: -15, source: TBD }\n- { cluster: clariden, scope: \"iopsstor weights mount (Lustre, flash)\", benchmark: Parallel read,   size: aggregate,    expected: TBD GB/s, tolerance_pct: -15, source: TBD }\n\n# \u2500\u2500 bristen (NVIDIA A100 \u2014 4 GPUs / node) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n- { cluster: bristen, scope: \"4\u00d7 A100, 1 node\",  benchmark: NCCL all_reduce,           size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: bristen, scope: \"4\u00d7 A100, 1 node\",  benchmark: NCCL all_gather,           size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: bristen, scope: \"4\u00d7 A100, 1 node\",  benchmark: NCCL alltoall,             size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: bristen, scope: \"4\u00d7 A100, 1 node\",  benchmark: NVSHMEM alltoall_latency,  size: 128 KiB, expected: TBD \u00b5s,         tolerance_pct: +20, source: TBD }\n- { cluster: bristen, scope: \"4\u00d7 A100, 1 node\",  benchmark: NVSHMEM shmem_put_bw,      size: 128 MiB, expected: TBD GB/s,       tolerance_pct: -10, source: TBD }\n- { cluster: bristen, scope: \"8\u00d7 A100, 2 nodes\", benchmark: NCCL all_reduce,           size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: bristen, scope: \"8\u00d7 A100, 2 nodes\", benchmark: NCCL all_gather,           size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: bristen, scope: \"8\u00d7 A100, 2 nodes\", benchmark: NCCL alltoall,             size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: bristen, scope: \"8\u00d7 A100, 2 nodes\", benchmark: NVSHMEM alltoall_latency,  size: 128 KiB, expected: TBD \u00b5s,         tolerance_pct: +20, source: TBD }\n- { cluster: bristen, scope: \"8\u00d7 A100, 2 nodes\", benchmark: NVSHMEM shmem_put_bw,      size: 128 MiB, expected: TBD GB/s,       tolerance_pct: -10, source: TBD }\n- { cluster: bristen, scope: \"capstor weights mount (Lustre, HDD)\",  benchmark: Sequential read, size: 1 MiB blocks, expected: TBD GB/s, tolerance_pct: -15, source: TBD }\n- { cluster: bristen, scope: \"capstor weights mount (Lustre, HDD)\",  benchmark: Parallel read,   size: aggregate,    expected: TBD GB/s, tolerance_pct: -15, source: TBD }\n- { cluster: bristen, scope: \"iopsstor weights mount (Lustre, flash)\", benchmark: Sequential read, size: 1 MiB blocks, expected: TBD GB/s, tolerance_pct: -15, source: TBD }\n- { cluster: bristen, scope: \"iopsstor weights mount (Lustre, flash)\", benchmark: Parallel read,   size: aggregate,    expected: TBD GB/s, tolerance_pct: -15, source: TBD }\n\n# \u2500\u2500 beverin (AMD MI300A \u2014 4 GPUs / node) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n- { cluster: beverin, scope: \"4\u00d7 MI300A, 1 node\",  benchmark: RCCL all_reduce,                size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: beverin, scope: \"4\u00d7 MI300A, 1 node\",  benchmark: RCCL all_gather,                size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: beverin, scope: \"4\u00d7 MI300A, 1 node\",  benchmark: RCCL alltoall,                  size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: beverin, scope: \"4\u00d7 MI300A, 1 node\",  benchmark: ROCm SHMEM alltoall_latency,    size: 128 KiB, expected: TBD \u00b5s,         tolerance_pct: +20, source: TBD }\n- { cluster: beverin, scope: \"4\u00d7 MI300A, 1 node\",  benchmark: ROCm SHMEM shmem_put_bw,        size: 128 MiB, expected: TBD GB/s,       tolerance_pct: -10, source: TBD }\n- { cluster: beverin, scope: \"8\u00d7 MI300A, 2 nodes\", benchmark: RCCL all_reduce,                size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: beverin, scope: \"8\u00d7 MI300A, 2 nodes\", benchmark: RCCL all_gather,                size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: beverin, scope: \"8\u00d7 MI300A, 2 nodes\", benchmark: RCCL alltoall,                  size: 128 MiB, expected: TBD GB/s busbw, tolerance_pct: -10, source: TBD }\n- { cluster: beverin, scope: \"8\u00d7 MI300A, 2 n